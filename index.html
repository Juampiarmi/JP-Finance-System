<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React;

/* ============================================================================
   HELPERS
   ============================================================================ */
function uid() {
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  return Date.now() + "-" + Math.random().toString(36).slice(2, 10);
}
// Código corto y legible (sin caracteres ambiguos como 0/O o 1/I) que
// identifica "este grupo de datos" en Supabase, sin necesidad de login.
// Se genera solo una vez por dispositivo y se puede copiar a otro dispositivo
// para que ambos compartan la misma información.
function genSyncCode() {
  const alphabet = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let out = "";
  for (let i = 0; i < 8; i++) {
    if (i === 4) out += "-";
    out += alphabet[Math.floor(Math.random() * alphabet.length)];
  }
  return out;
}
function formatCurrency(value, currency = "ARS", locale = "es-AR") {

  const monthTx = transactions.filter((t) => monthKey(t.date) === cm);
  const income = monthTx.filter((t) => t.type === "income").reduce((s, t) => s + t.amount, 0);
  const expense = monthTx.filter((t) => t.type === "expense" && !t.isOccasional).reduce((s, t) => s + t.amount, 0);

function computeWalletFlow(accounts, transactions, categories) {

    .filter((t) => t.isRecurring && t.recurrence && t.recurrence.active && fixedCategoryIds.has(t.categoryId))
    .reduce((s, t) => s + t.amount, 0);
  const freeToSpend = Math.max(walletBalance - reserved, 0);
  const last3 = computeMonthlyTotals(excludeOccasionalExpenses(transactions), lastNMonths(3));
  const avgMonthlyExpense = (last3.reduce((s, m) => s + m.expense, 0) / 3) || 0;

function computeDailySpendLimit(accounts, transactions, categories) {

  const occasionalToday = transactions.filter((t) => t.type === "expense" && t.date === todayStr && t.isOccasional).reduce((s, t) => s + t.amount, 0);

function installmentSchedule(p) {

function computeUpcomingDue(transactions, installments, daysAhead = 15) {
  const now = new Date();

  const limitDate = new Date(now); limitDate.setDate(limitDate.getDate() + daysAhead);
  const limitStr = limitDate.toISOString().slice(0, 10);
  const items = [];
  transactions.filter((t) => t.isRecurring && t.recurrence && t.recurrence.active).forEach((t) => {
    const due = t.recurrence.nextDate;
    if (due >= todayStr && due <= limitStr) items.push({ id: t.id + "-rec", description: t.description, amount: t.amount, date: due, kind: "recurrente" });
  });
  (installments || []).forEach((p) => {
    installmentSchedule(p).forEach((s) => {
      if (s.date >= todayStr && s.date <= limitStr) items.push({ id: p.id + "-" + s.index, description: p.description + " (cuota " + s.index + "/" + p.installmentsCount + ")", amount: p.installmentAmount, date: s.date, kind: "cuota" });
    });

function computeMonthClosingStrategy(transactions, categories) {
  const projection = computeProjectedCashFlow(transactions);
  const last3 = computeMonthlyTotals(excludeOccasionalExpenses(transactions), lastNMonths(3));
  const avgMonthlyExpense = (last3.reduce((s, m) => s + m.expense, 0) / 3) || projection.expense || 0;
  const surplus = projection.projectedCashFlow;
  let recommendation;
  if (surplus > 0) {
    const toSave = Math.round(surplus * 0.6);
    recommendation = { kind: "surplus", toSave, toKeep: surplus - toSave, surplus };
  } else if (surplus < 0) {
    const cm = monthKey(new Date().toISOString());
    const monthExp = transactions.filter((t) => t.type === "expense" && monthKey(t.date) === cm && !t.isOccasional);
    const byCat = new Map();
    monthExp.forEach((t) => {
      const cat = categories.find((c) => c.id === t.categoryId);
      if (cat && cat.budgetGroup === "wants") byCat.set(cat.id, (byCat.get(cat.id) || 0) + t.amount);
    });
    let worst = null;
    byCat.forEach((amount, cid) => { if (!worst || amount > worst.amount) worst = { cid, amount }; });
    const worstCategory = worst ? categories.find((c) => c.id === worst.cid) : null;
    recommendation = { kind: "deficit", deficit: Math.abs(surplus), worstCategory, worstCategoryAmount: worst ? worst.amount : 0 };
  } else {

  return { avgMonthlyExpense, projection, recommendation };
}
// Motor de comparación histórica: gasto del mes actual, por categoría, contra

function computeMonthlyComparison(transactions, categories) {
  const cm = monthKey(new Date().toISOString());
  const prevMonths = lastNMonths(4).filter((m) => m !== cm);
  const sumByCategory = (m) => {
    const map = new Map();
    transactions.filter((t) => t.type === "expense" && monthKey(t.date) === m).forEach((t) => map.set(t.categoryId, (map.get(t.categoryId) || 0) + t.amount));
    return map;
  };
  const currentMap = sumByCategory(cm);
  const prevMaps = prevMonths.map(sumByCategory);
  const allCatIds = new Set([...currentMap.keys(), ...prevMaps.flatMap((m) => Array.from(m.keys()))]);
  const rows = Array.from(allCatIds).map((cid) => {
    const cat = categories.find((c) => c.id === cid);
    const current = currentMap.get(cid) || 0;
    const avgPrev = prevMaps.reduce((s, m) => s + (m.get(cid) || 0), 0) / (prevMonths.length || 1);
    const deltaPercent = avgPrev > 0 ? ((current - avgPrev) / avgPrev) * 100 : (current > 0 ? 100 : 0);
    return { categoryId: cid, name: cat ? cat.name : "Otros", color: cat ? cat.color : "#94A3B8", current, avgPrev, deltaPercent };
  }).filter((r) => r.current > 0 || r.avgPrev > 0).sort((a, b) => b.deltaPercent - a.deltaPercent);

  const avgPrevTotal = prevMaps.reduce((sum, m) => sum + Array.from(m.values()).reduce((s, v) => s + v, 0), 0) / (prevMonths.length || 1);
  const totalDeltaPercent = avgPrevTotal > 0 ? ((currentTotal - avgPrevTotal) / avgPrevTotal) * 100 : 0;

// AI Financial Copilot: consolida patrimonio, flujo de caja y hábitos de

function computeCopilotDiagnostics(transactions, categories, accounts) {

  const comparison = computeMonthlyComparison(transactions, categories);
  const cm = monthKey(new Date().toISOString());

  const monthIncome = transactions.filter((t) => t.type === "income" && monthKey(t.date) === cm).reduce((s, t) => s + t.amount, 0);
  const diagnostics = [];

  // 1) Comparación histórica: categorías que subieron fuerte vs el promedio
  comparison.rows.filter((r) => r.deltaPercent >= 30 && r.current >= 20).slice(0, 3).forEach((r) => {
    diagnostics.push({

    });

  if (comparison.avgPrevTotal > 0 && comparison.totalDeltaPercent >= 15) {

      detail: "Vas " + formatCurrency(comparison.currentTotal) + " gastados este mes, un " + Math.round(comparison.totalDeltaPercent) + "% más que tu promedio mensual reciente de " + formatCurrency(comparison.avgPrevTotal) + ".",
    });
  }

  // 2) Estrategia de compras — evaluador de gastos mayores
  const biggest = [...monthExpenses].sort((a, b) => b.amount - a.amount)[0];
  if (biggest && monthIncome > 0 && biggest.amount >= monthIncome * 0.15) {
    const cat = categories.find((c) => c.id === biggest.categoryId);
    diagnostics.push({
      type: "compra", icon: "shopping-bag", title: "Gasto grande para evaluar",
      detail: "\"" + biggest.description + "\" (" + (cat ? cat.name : "sin categoría") + ") fue de " + formatCurrency(biggest.amount) + " — un " + Math.round((biggest.amount / monthIncome) * 100) + "% de tus ingresos de este mes. Antes de repetir una compra así, evaluá si encaja con tus metas actuales.",
    });
  }

  // 3) Optimización de ahorro — gasto hormiga (muchas compras chicas repetidas)
  const countByCategory = new Map();
  monthExpenses.forEach((t) => {
    const e = countByCategory.get(t.categoryId) || { count: 0, total: 0 };
    e.count += 1; e.total += t.amount;
    countByCategory.set(t.categoryId, e);
  });
  const antTrend = Array.from(countByCategory.entries())
    .map(([cid, v]) => ({ cid, ...v, avg: v.total / v.count, cat: categories.find((c) => c.id === cid) }))
    .filter((r) => r.count >= 4 && r.avg > 0 && r.avg <= Math.max(30, monthIncome * 0.01))
    .sort((a, b) => b.total - a.total)[0];
  if (antTrend) {
    diagnostics.push({
      type: "ahorro", icon: "coins", title: "Gasto hormiga en " + (antTrend.cat ? antTrend.cat.name : "una categoría"),
      detail: "Hiciste " + antTrend.count + " compras chicas en " + (antTrend.cat ? antTrend.cat.name : "esta categoría") + " este mes (promedio " + formatCurrency(antTrend.avg) + " c/u) que suman " + formatCurrency(antTrend.total) + ". Son gastos que pasan desapercibidos pero pesan en el total.",
    });
  }

  // 4) Sugerencia de inversión de excedentes
  const investedTotal = accounts.filter((a) => a.isAsset && a.type === "investment").reduce((s, a) => s + a.balance, 0);
  const idleCash = accounts.filter((a) => a.isAsset && ["cash", "wallet", "checking", "savings"].includes(a.type)).reduce((s, a) => s + a.balance, 0);
  if (kpis.monthlyCashFlow > 0 && runway.months >= runway.targetMonths) {
    diagnostics.push({
      type: "inversion", icon: "line-chart", title: "Tenés margen para invertir el excedente",
      detail: "Tu colchón de emergencia ya cubre " + runway.months.toFixed(1) + " meses (meta: " + runway.targetMonths + "). Este mes te sobraron " + formatCurrency(kpis.monthlyCashFlow) + " — con la reserva ya cubierta, podrías destinar parte de eso a tu fondo de inversión en vez de dejarlo ocioso en efectivo o billeteras.",
    });

    diagnostics.push({
      type: "inversion", icon: "line-chart", title: "Todavía no tenés nada invertido",
      detail: "Tenés " + formatCurrency(idleCash) + " repartidos en efectivo, billeteras y bancos, y ningún fondo de inversión cargado. Una vez cubierto tu colchón de emergencia, considerá empezar a invertir una parte.",
    });
  }

  if (diagnostics.length === 0) {
    diagnostics.push({ type: "info", icon: "check-circle-2", title: "Todo en orden", detail: "No detectamos alertas este mes: tu gasto está en línea con tu promedio reciente y no hay compras grandes ni gasto hormiga fuera de lo normal." });
  }

  return { diagnostics, kpis, runway, comparison, monthIncome, monthExpensesTotal: monthExpenses.reduce((s, t) => s + t.amount, 0) };
}
function computeCompoundInterest({ initial, monthlyContribution, annualRatePercent, years }) {
  const monthlyRate = annualRatePercent / 100 / 12;
  const points = [{ year: 0, contributions: 0, interest: 0, total: initial }];
  let balance = initial, totalContrib = 0;
  for (let year = 1; year <= years; year++) {
    for (let m = 0; m < 12; m++) { balance = balance * (1 + monthlyRate) + monthlyContribution; totalContrib += monthlyContribution; }
    points.push({ year, contributions: totalContrib, interest: Math.max(balance - initial - totalContrib, 0), total: balance });
  }
  return points;
}
function simulateDebtPayoff(debts, extraMonthlyPayment, strategy) {
  const working = debts.map((d) => ({ ...d, remaining: d.balance }));
  const sorted = [...working].sort((a, b) => strategy === "avalanche" ? b.interestRate - a.interestRate : a.balance - b.balance);
  const months = []; const payoffOrder = [];
  let month = 0, totalPaid = 0, totalInterest = 0;
  const maxMonths = 600;
  while (sorted.some((d) => d.remaining > 0.01) && month < maxMonths) {
    month++;
    let extra = extraMonthlyPayment;
    for (const debt of sorted) {
      if (debt.remaining <= 0) continue;
      const monthlyInterest = (debt.interestRate / 100 / 12) * debt.remaining;
      totalInterest += monthlyInterest; debt.remaining += monthlyInterest;
      const payment = Math.min(debt.minimumPayment, debt.remaining);
      debt.remaining -= payment; totalPaid += payment;
    }
    for (const debt of sorted) {
      if (extra <= 0) break;
      if (debt.remaining <= 0) continue;
      const payment = Math.min(extra, debt.remaining);
      debt.remaining -= payment; totalPaid += payment; extra -= payment;
    }
    for (const debt of sorted) {
      if (debt.remaining <= 0.01 && !payoffOrder.find((p) => p.id === debt.id)) payoffOrder.push({ id: debt.id, name: debt.name, monthPaidOff: month });
    }
    months.push({ month, totalRemaining: sorted.reduce((s, d) => s + Math.max(d.remaining, 0), 0), totalPaid, totalInterest });
  }
  return { months, payoffOrder };
}

const ACCOUNT_TYPE_LABEL = { cash: "Efectivo", wallet: "Billetera Virtual", checking: "Cuenta Corriente", savings: "Caja de Ahorro", investment: "Inversión", credit: "Tarjeta de Crédito", other: "Otro" };

function isoDaysAgo(days) { const d = new Date(); d.setDate(d.getDate() - days); return d.toISOString().slice(0, 10); }
function isoMonthsAgo(months, day = 5) { const d = new Date(); d.setMonth(d.getMonth() - months); d.setDate(day); return d.toISOString().slice(0, 10); }

      { date: isoMonthsAgo(m, 7), description: "Supermercado", amount: 48000, type: "expense", categoryId: "cat-groceries", account: "Tarjeta de Crédito" },

      { date: isoMonthsAgo(m, 12), description: "Cena en restaurante", amount: 9500, type: "expense", categoryId: "cat-dining", account: "Tarjeta de Crédito" },
      { date: isoMonthsAgo(m, 18), description: "Streaming (Netflix, Spotify)", amount: 3200, type: "expense", categoryId: "cat-subscriptions", account: "Tarjeta de Crédito", isRecurring: true, recurrence: { frequency: "monthly", nextDate: isoMonthsAgo(m - 1, 18), active: m === 0 } },
      { date: isoMonthsAgo(m, 20), description: "Aporte a inversión", amount: 70000, type: "expense", categoryId: "cat-investing", account: "Portafolio de Inversión" },
      { date: isoMonthsAgo(m, 22), description: "Ahorro programado", amount: 40000, type: "expense", categoryId: "cat-savings", account: "Caja de Ahorro" }

/* ============================================================================
   LOCAL STORAGE LAYER
   ============================================================================ */
const KEYS = {
  transactions: "jpfs:transactions", categories: "jpfs:categories", budgets: "jpfs:budgets",
  goals: "jpfs:goals", debts: "jpfs:debts", accounts: "jpfs:accounts", profile: "jpfs:profile",
  supabaseConfig: "jpfs:supabase-config", seeded: "jpfs:seeded", syncCode: "jpfs:sync-code",
  installments: "jpfs:installments",
};
function loadLocal(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
}
function saveLocal(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
function withSeed(key, seedBuilder) {
  const raw = localStorage.getItem(key);
  if (raw) { try { return JSON.parse(raw); } catch (e) { return []; } }
  if (localStorage.getItem(KEYS.seeded)) return [];
  return seedBuilder();
}

/* ============================================================================
   ICON
   ============================================================================ */
function Icon({ name, size = 18, className = "", style = {} }) {
  const ref = useRef(null);
  useEffect(() => {
    if (window.lucide && ref.current) {
      ref.current.innerHTML = "";
      window.lucide.createIcons({ nameAttr: "data-lucide", icons: window.lucide.icons, attrs: {}, nodes: [ref.current] });
    }
  });
  return <i ref={ref} data-lucide={name} className={className} style={{ width: size, height: size, display: "inline-block", ...style }}></i>;
}

/* ============================================================================
   TOAST
   ============================================================================ */
const ToastContext = createContext(null);
function ToastProvider({ children }) {
  const [items, setItems] = useState([]);
  const toast = useCallback(({ title, description, variant = "info" }) => {
    const id = uid();
    setItems((prev) => [...prev, { id, title, description, variant }]);
    setTimeout(() => setItems((prev) => prev.filter((i) => i.id !== id)), 4000);
  }, []);
  const ICONS = { success: "check-circle-2", error: "x-circle", info: "info" };
  const COLORS = { success: "text-emerald-metallic", error: "text-crimson-elegant", info: "text-cobalt" };
  return (
    <ToastContext.Provider value={{ toast }}>
      {children}
      <div className="fixed bottom-20 md:bottom-4 right-4 z-[100] flex w-96 max-w-[calc(100vw-2rem)] flex-col gap-2">
        {items.map((m) => (
          <div key={m.id} className="flex items-start gap-3 rounded-lg border border-slate-800 bg-slate-950/95 backdrop-blur-xl p-4 shadow-2xl animate-fade-in">
            <Icon name={ICONS[m.variant]} className={COLORS[m.variant]} />
            <div className="flex-1 min-w-0">
              <p className="text-sm font-medium text-slate-100">{m.title}</p>
              {m.description && <p className="text-xs text-slate-500 mt-0.5">{m.description}</p>}
            </div>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}
function useToast() { return useContext(ToastContext); }

   CENTRO DE CONTROL — navegación global y accesos rápidos

const NavContext = createContext(null);
function NavProvider({ children }) {
  const [page, setPageState] = useState("dashboard");
  // Un único estado para "qué movimiento se está cargando" (ingreso, gasto o
  // transferencia). Al ser una sola variable, nunca puede haber dos paneles
  // abiertos al mismo tiempo — solo una capa visual activa a la vez.
  const [movement, setMovement] = useState(null); // { type: 'income' | 'expense' | 'transfer' } | null

  const setPage = useCallback((p) => { setPageState(p); if (typeof window !== "undefined") window.scrollTo({ top: 0, behavior: "smooth" }); }, []);
  const goHome = useCallback(() => setPage("dashboard"), [setPage]);
  const openMovement = useCallback((type, categoryId) => setMovement({ type, categoryId: categoryId || null }), []);
  const closeMovement = useCallback(() => setMovement(null), []);

  const value = { page, setPage, goHome, movement, openMovement, closeMovement };
  return <NavContext.Provider value={value}>{children}</NavContext.Provider>;
}
function useNav() { return useContext(NavContext); }

/* ============================================================================
   APP DATA STORE (LocalStorage + Supabase opcional)
   ============================================================================ */
const AppDataContext = createContext(null);
function AppDataProvider({ children }) {
  const [transactions, setTransactions] = useState(() => {
    const now = new Date().toISOString();
    return withSeed(KEYS.transactions, () => buildSeedTransactions().map((t) => ({ ...t, id: uid(), createdAt: now, updatedAt: now })));
  });
  const [categories, setCategories] = useState(() => loadLocal(KEYS.categories, DEFAULT_CATEGORIES));
  const [budgets, setBudgets] = useState(() => loadLocal(KEYS.budgets, []));
  const [goals, setGoals] = useState(() => {
    const now = new Date().toISOString();
    return withSeed(KEYS.goals, () => buildSeedGoals().map((g) => ({ ...g, id: uid(), createdAt: now })));
  });
  const [debts, setDebts] = useState(() => {
    const now = new Date().toISOString();
    return withSeed(KEYS.debts, () => buildSeedDebts().map((d) => ({ ...d, id: uid(), createdAt: now })));
  });
  const [accounts, setAccounts] = useState(() => loadLocal(KEYS.accounts, DEFAULT_ACCOUNTS));
  // Compras en cuotas (3/6/12 cuotas) — igual que las deudas, es un dato solo
  // local: no se sincroniza a Supabase, así que no toca la nube en absoluto.
  const [installments, setInstallments] = useState(() => loadLocal(KEYS.installments, []));
  const [profile, setProfile] = useState(() => loadLocal(KEYS.profile, DEFAULT_PROFILE));
  const [supabaseConfig, setSupabaseConfig] = useState(() => loadLocal(KEYS.supabaseConfig, { url: "", anonKey: "" }));
  // Sincronización directa por código de dispositivo: SIN email, SIN magic
  // link. Cada tabla en Supabase se filtra por esta columna "device_code" en
  // vez de un user_id de Supabase Auth — se ingresa el mismo código en dos
  // dispositivos y sus datos se sincronizan automáticamente entre ellos.
  const [syncCode, setSyncCodeState] = useState(() => {
    const saved = loadLocal(KEYS.syncCode, null);
    if (saved) return saved;
    const fresh = genSyncCode();
    saveLocal(KEYS.syncCode, fresh);
    return fresh;
  });
  const [cloudClient, setCloudClient] = useState(null);
  const [syncing, setSyncing] = useState(false);
  const [lastSyncAt, setLastSyncAt] = useState(null);
  const hydratedKey = useRef(null);

  const setSyncCode = useCallback((code) => {
    const clean = (code || "").trim().toUpperCase();
    setSyncCodeState(clean);
    saveLocal(KEYS.syncCode, clean);
    hydratedKey.current = null; // forzar re-hidratación con el nuevo código
  }, []);

  useEffect(() => { if (!localStorage.getItem(KEYS.seeded)) localStorage.setItem(KEYS.seeded, "1"); }, []);
  useEffect(() => saveLocal(KEYS.transactions, transactions), [transactions]);
  useEffect(() => saveLocal(KEYS.categories, categories), [categories]);
  useEffect(() => saveLocal(KEYS.budgets, budgets), [budgets]);
  useEffect(() => saveLocal(KEYS.goals, goals), [goals]);
  useEffect(() => saveLocal(KEYS.debts, debts), [debts]);
  useEffect(() => saveLocal(KEYS.accounts, accounts), [accounts]);
  useEffect(() => saveLocal(KEYS.installments, installments), [installments]);
  useEffect(() => saveLocal(KEYS.profile, profile), [profile]);
  useEffect(() => saveLocal(KEYS.supabaseConfig, supabaseConfig), [supabaseConfig]);

  // Conecta directo a Supabase con la URL + Anon Key guardadas. No hay
  // inicio de sesión: la conexión queda lista apenas se guarda la config.
  useEffect(() => {
    if (!supabaseConfig.url || !supabaseConfig.anonKey || !window.supabase) { setCloudClient(null); return; }
    try {
      const client = window.supabase.createClient(supabaseConfig.url, supabaseConfig.anonKey, { auth: { persistSession: false } });
      setCloudClient(client);
    } catch (e) { setCloudClient(null); }
  }, [supabaseConfig.url, supabaseConfig.anonKey]);

  const pullFromCloud = useCallback(async () => {
    if (!cloudClient || !syncCode) return { success: false, error: "Faltan datos de conexión." };
    setSyncing(true);
    try {
      const [txRes, budRes, goalRes] = await Promise.all([
        cloudClient.from("transactions").select("*").eq("device_code", syncCode),
        cloudClient.from("budgets").select("*").eq("device_code", syncCode),
        cloudClient.from("goals").select("*").eq("device_code", syncCode),
      ]);
      if (txRes.error) throw txRes.error;
      if (txRes.data && txRes.data.length) {
        setTransactions(txRes.data.map((r) => ({ id: r.id, date: r.date, description: r.description, amount: Number(r.amount), type: r.type, categoryId: r.category_id, account: r.account || "", notes: r.notes || undefined, isRecurring: r.is_recurring || false, recurrence: r.recurrence || undefined, fromAccountId: r.from_account_id || undefined, toAccountId: r.to_account_id || undefined, createdAt: r.created_at, updatedAt: r.updated_at })));
      }
      if (budRes.data && budRes.data.length) {
        setBudgets(budRes.data.map((r) => ({ id: r.id, categoryId: r.category_id, monthlyLimit: Number(r.monthly_limit), month: r.month })));
      }
      if (goalRes.data && goalRes.data.length) {
        setGoals(goalRes.data.map((r) => ({ id: r.id, name: r.name, type: r.type, targetAmount: Number(r.target_amount), currentAmount: Number(r.current_amount), targetDate: r.target_date || undefined, color: r.color, createdAt: r.created_at })));
      }
      setLastSyncAt(new Date().toISOString());
      setSyncing(false);
      return { success: true };
    } catch (e) {
      setSyncing(false);
      return { success: false, error: (e && e.message) || "No se pudo sincronizar. Revisá la URL, la clave y que la tabla tenga la columna device_code." };
    }
  }, [cloudClient, syncCode]);

  // Hidratación automática la primera vez que hay conexión + código listos
  useEffect(() => {
    if (!cloudClient || !syncCode) return;
    const key = syncCode;
    if (hydratedKey.current === key) return;
    hydratedKey.current = key;
    pullFromCloud();
  }, [cloudClient, syncCode, pullFromCloud]);

  const pushCloud = useCallback((table, row) => {
    if (!cloudClient || !syncCode) return;
    cloudClient.from(table).upsert({ ...row, device_code: syncCode }).then(({ error }) => { if (error) console.warn(error); else setLastSyncAt(new Date().toISOString()); });
  }, [cloudClient, syncCode]);
  const removeCloud = useCallback((table, id) => {
    if (!cloudClient || !syncCode) return;
    cloudClient.from(table).delete().eq("id", id).eq("device_code", syncCode).then(() => {});
  }, [cloudClient, syncCode]);

  const addTransaction = useCallback((t) => {
    const now = new Date().toISOString();
    const newTx = { ...t, id: uid(), createdAt: now, updatedAt: now };
    setTransactions((prev) => [newTx, ...prev]);
    // Actualiza al instante el saldo de la caja de origen/destino elegida.
    // accountId es un dato solo local: no se agrega a lo que se envía a
    // Supabase (el payload de pushCloud de abajo queda intacto).
    if (newTx.accountId) {
      const sign = newTx.type === "income" ? 1 : -1;
      setAccounts((prev) => prev.map((a) => a.id === newTx.accountId ? { ...a, balance: a.balance + sign * newTx.amount } : a));
    }
    if (newTx.type !== "transfer") {
      pushCloud("transactions", { id: newTx.id, date: newTx.date, description: newTx.description, amount: newTx.amount, type: newTx.type, category_id: newTx.categoryId, account: newTx.account, notes: newTx.notes || null, is_recurring: newTx.isRecurring || false, recurrence: newTx.recurrence || null, created_at: newTx.createdAt, updated_at: newTx.updatedAt });
    }
    return newTx;
  }, [pushCloud]);
  // Las transferencias entre cuentas se registran localmente (mueven saldo entre
  // dos cuentas) y no se sincronizan a Supabase, ya que el esquema de la tabla
  // `transactions` solo admite type in ('income','expense').
  const addTransfer = useCallback((t) => {
    const now = new Date().toISOString();
    const newTx = { id: uid(), type: "transfer", date: t.date, description: (t.description && t.description.trim()) || "Transferencia interna", amount: t.amount, fromAccountId: t.fromAccountId, toAccountId: t.toAccountId, createdAt: now, updatedAt: now };
    setTransactions((prev) => [newTx, ...prev]);
    setAccounts((prev) => prev.map((a) => {
      if (a.id === t.fromAccountId) return { ...a, balance: a.balance - t.amount };
      if (a.id === t.toAccountId) return { ...a, balance: a.balance + t.amount };
      return a;
    }));
    return newTx;
  }, []);
  const duplicateTransaction = useCallback((id) => {
    const tx = transactions.find((t) => t.id === id);
    if (!tx) return null;
    if (tx.type === "transfer") {
      return addTransfer({ date: new Date().toISOString().slice(0, 10), fromAccountId: tx.fromAccountId, toAccountId: tx.toAccountId, amount: tx.amount, description: tx.description });
    }
    return addTransaction({ date: new Date().toISOString().slice(0, 10), description: tx.description, amount: tx.amount, type: tx.type, categoryId: tx.categoryId, account: tx.account, accountId: tx.accountId, notes: tx.notes, isRecurring: false, recurrence: undefined });
    // eslint-disable-next-line
  }, [transactions]);
  const updateTransaction = useCallback((id, t) => {
    const updatedAt = new Date().toISOString();
    setTransactions((prev) => {
      const old = prev.find((tx) => tx.id === id);
      // Si cambia el monto, el tipo o la caja de una transacción ya cargada,
      // revierte el efecto anterior sobre esa caja y aplica el nuevo — así
      // el saldo de Efectivo/Billetera nunca queda desincronizado al editar.
      if (old && old.type !== "transfer" && (old.accountId || t.accountId !== undefined)) {
        const merged = { ...old, ...t };
        const oldSign = old.type === "income" ? 1 : -1;
        const newSign = merged.type === "income" ? 1 : -1;
        setAccounts((accPrev) => accPrev.map((a) => {
          let bal = a.balance;
          if (old.accountId && a.id === old.accountId) bal -= oldSign * old.amount;
          if (merged.accountId && a.id === merged.accountId) bal += newSign * merged.amount;
          return bal !== a.balance ? { ...a, balance: bal } : a;
        }));
      }
      return prev.map((tx) => tx.id === id ? { ...tx, ...t, updatedAt } : tx);
    });
    pushCloud("transactions", { id, ...(t.date !== undefined && { date: t.date }), ...(t.description !== undefined && { description: t.description }), ...(t.amount !== undefined && { amount: t.amount }), ...(t.type !== undefined && { type: t.type }), ...(t.categoryId !== undefined && { category_id: t.categoryId }), ...(t.account !== undefined && { account: t.account }), ...(t.notes !== undefined && { notes: t.notes }), ...(t.recurrence !== undefined && { recurrence: t.recurrence }), updated_at: updatedAt });
  }, [pushCloud]);
  const deleteTransaction = useCallback((id) => {
    setTransactions((prev) => {
      const tx = prev.find((t) => t.id === id);
      if (tx && tx.type === "transfer") {
        // Revierte el movimiento de saldo entre cuentas antes de borrar el registro
        setAccounts((accPrev) => accPrev.map((a) => {
          if (a.id === tx.fromAccountId) return { ...a, balance: a.balance + tx.amount };
          if (a.id === tx.toAccountId) return { ...a, balance: a.balance - tx.amount };
          return a;
        }));
      } else if (tx && tx.accountId) {
        // Revierte el efecto que este gasto/ingreso tuvo sobre su caja.
        const sign = tx.type === "income" ? 1 : -1;
        setAccounts((accPrev) => accPrev.map((a) => a.id === tx.accountId ? { ...a, balance: a.balance - sign * tx.amount } : a));
      }
      return prev.filter((t) => t.id !== id);
    });
    removeCloud("transactions", id);
  }, [removeCloud]);
  const bulkAddTransactions = useCallback((items) => {
    const now = new Date().toISOString();
    const newItems = items.map((t) => ({ ...t, id: uid(), createdAt: now, updatedAt: now }));
    setTransactions((prev) => [...newItems, ...prev]);
    newItems.forEach((newTx) => pushCloud("transactions", { id: newTx.id, date: newTx.date, description: newTx.description, amount: newTx.amount, type: newTx.type, category_id: newTx.categoryId, account: newTx.account, notes: newTx.notes || null, created_at: newTx.createdAt, updated_at: newTx.updatedAt }));
    return newItems;
  }, [pushCloud]);

  const upsertBudget = useCallback((b) => {
    setBudgets((prev) => {
      const id = b.id || uid();
      const newBudget = { ...b, id };
      pushCloud("budgets", { id: newBudget.id, category_id: newBudget.categoryId, monthly_limit: newBudget.monthlyLimit, month: newBudget.month });
      const idx = prev.findIndex((x) => x.id === id);
      if (idx >= 0) { const copy = [...prev]; copy[idx] = newBudget; return copy; }
      return [...prev, newBudget];
    });
  }, [pushCloud]);
  const deleteBudget = useCallback((id) => { setBudgets((prev) => prev.filter((b) => b.id !== id)); removeCloud("budgets", id); }, [removeCloud]);

  const addGoal = useCallback((g) => {
    const newGoal = { ...g, id: uid(), createdAt: new Date().toISOString() };
    setGoals((prev) => [...prev, newGoal]);
    pushCloud("goals", { id: newGoal.id, name: newGoal.name, type: newGoal.type, target_amount: newGoal.targetAmount, current_amount: newGoal.currentAmount, target_date: newGoal.targetDate || null, color: newGoal.color, created_at: newGoal.createdAt });
  }, [pushCloud]);
  const updateGoal = useCallback((id, g) => {
    setGoals((prev) => prev.map((goal) => goal.id === id ? { ...goal, ...g } : goal));
    pushCloud("goals", { id, ...(g.name !== undefined && { name: g.name }), ...(g.currentAmount !== undefined && { current_amount: g.currentAmount }), ...(g.targetAmount !== undefined && { target_amount: g.targetAmount }) });
  }, [pushCloud]);
  const deleteGoal = useCallback((id) => { setGoals((prev) => prev.filter((g) => g.id !== id)); removeCloud("goals", id); }, [removeCloud]);

  const addDebt = useCallback((d) => setDebts((prev) => [...prev, { ...d, id: uid(), createdAt: new Date().toISOString() }]), []);
  const deleteDebt = useCallback((id) => setDebts((prev) => prev.filter((d) => d.id !== id)), []);

  const addInstallment = useCallback((p) => setInstallments((prev) => [...prev, { ...p, id: uid(), createdAt: new Date().toISOString() }]), []);
  const deleteInstallment = useCallback((id) => setInstallments((prev) => prev.filter((p) => p.id !== id)), []);

  const addAccount = useCallback((a) => setAccounts((prev) => [...prev, { ...a, id: uid() }]), []);
  const deleteAccount = useCallback((id) => setAccounts((prev) => prev.filter((a) => a.id !== id)), []);
  // Ajuste manual y directo del saldo de una caja (por ejemplo, para corregir
  // el "Saldo Inicial" de Efectivo o Billetera Virtual desde el Dashboard).
  const setAccountBalance = useCallback((id, balance) => setAccounts((prev) => prev.map((a) => a.id === id ? { ...a, balance } : a)), []);

  // Vacía transacciones, metas, deudas y presupuestos de prueba para que la
  // persona pueda empezar con su información real. Mantiene el perfil, las
  // categorías y la configuración de sincronización. Las cajas de Efectivo y
  // Billetera Virtual no se eliminan del todo — vuelven a $0 — para que el
  // Dashboard de uso diario siga funcionando apenas se cargan movimientos reales.
  const resetAllData = useCallback(() => {
    setTransactions([]);
    setGoals([]);
    setDebts([]);
    setInstallments([]);
    setAccounts([
      { id: uid(), name: "Efectivo", type: "cash", balance: 0, isAsset: true },
      { id: uid(), name: "Billetera Virtual", type: "wallet", balance: 0, isAsset: true },
    ]);
    setBudgets([]);
  }, []);

  const updateProfile = useCallback((p) => setProfile((prev) => ({ ...prev, ...p })), []);
  const toggleHideBalances = useCallback(() => setProfile((prev) => ({ ...prev, hideBalances: !prev.hideBalances })), []);

  const exportJSON = useCallback(() => JSON.stringify({ transactions, categories, budgets, goals, debts, installments, accounts, profile, exportedAt: new Date().toISOString() }, null, 2), [transactions, categories, budgets, goals, debts, installments, accounts, profile]);
  const importJSON = useCallback((json) => {
    try {
      const p = JSON.parse(json);
      if (p.transactions) setTransactions(p.transactions);
      if (p.categories) setCategories(p.categories);
      if (p.budgets) setBudgets(p.budgets);
      if (p.goals) setGoals(p.goals);
      if (p.debts) setDebts(p.debts);
      if (p.installments) setInstallments(p.installments);
      if (p.accounts) setAccounts(p.accounts);
      if (p.profile) setProfile((prev) => ({ ...prev, ...p.profile }));
      return { success: true };
    } catch (e) { return { success: false, error: "El archivo JSON no es válido." }; }
  }, []);
  const exportCSV = useCallback(() => {
    const header = ["date", "description", "amount", "type", "categoryId", "account", "notes"];
    const rows = transactions.map((t) => [t.date, '"' + (t.description || "").replace(/"/g, '""') + '"', t.amount, t.type, t.categoryId, t.account, t.notes || ""].join(","));
    return [header.join(","), ...rows].join("\n");
  }, [transactions]);
  const importCSV = useCallback((csv) => {
    try {
      const lines = csv.trim().split("\n");
      const [headerLine, ...rows] = lines;
      const headers = headerLine.split(",").map((h) => h.trim());
      const now = new Date().toISOString();
      const parsed = rows.filter((r) => r.trim()).map((row) => {
        const cols = row.match(/(".*?"|[^,]+)(?=,|$)/g) || [];
        const obj = {};
        headers.forEach((h, i) => { obj[h] = (cols[i] || "").replace(/^"|"$/g, "").replace(/""/g, '"'); });
        return { id: uid(), date: obj.date, description: obj.description, amount: parseFloat(obj.amount) || 0, type: obj.type === "income" ? "income" : "expense", categoryId: obj.categoryId || "cat-other", account: obj.account || "Cuenta Corriente", notes: obj.notes || undefined, createdAt: now, updatedAt: now };
      });
      setTransactions((prev) => [...parsed, ...prev]);
      return { success: true, imported: parsed.length };
    } catch (e) { return { success: false, imported: 0, error: "No se pudo procesar el archivo CSV." }; }
  }, []);

  const value = {
    transactions, categories, budgets, goals, debts, accounts, installments, profile,
    supabaseConfig, setSupabaseConfig, syncCode, setSyncCode, syncing, lastSyncAt, pullFromCloud,
    cloudEnabled: !!cloudClient && !!syncCode,
    addTransaction, updateTransaction, deleteTransaction, bulkAddTransactions, addTransfer, duplicateTransaction,
    upsertBudget, deleteBudget, addGoal, updateGoal, deleteGoal, addDebt, deleteDebt,
    addInstallment, deleteInstallment,
    addAccount, deleteAccount, setAccountBalance, resetAllData, updateProfile, toggleHideBalances,
    exportJSON, importJSON, exportCSV, importCSV,
  };
  return <AppDataContext.Provider value={value}>{children}</AppDataContext.Provider>;
}

function useChart(canvasRef, config, deps) {
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current.getContext("2d"), config);
    return () => { if (chartRef.current) chartRef.current.destroy(); };
    // eslint-disable-next-line
  }, deps);
}
function DoughnutChart({ data, currency }) {
  const canvasRef = useRef(null);
  useChart(canvasRef, {
    type: "doughnut",
    data: { labels: data.map((d) => d.name), datasets: [{ data: data.map((d) => d.value), backgroundColor: data.map((d) => d.color), borderWidth: 0, spacing: 2 }] },
    options: {
      cutout: "68%", responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { backgroundColor: "rgba(9,13,22,0.95)", borderColor: "rgba(148,163,184,0.2)", borderWidth: 1, padding: 10, callbacks: { label: (ctx) => formatCurrency(ctx.parsed, currency) } } },
    },
  }, [JSON.stringify(data), currency]);
  return <canvas ref={canvasRef} height="240"></canvas>;
}
function BarChartCmp({ labels, income, expense, currency }) {

function AreaChartCmp({ labels, series, color, currency, xSuffix = "" }) {

// Widget principal del Dashboard: responde de inmediato "¿cuánta plata me
// queda en el bolsillo y en la billetera virtual hoy?" — con el total
// consolidado arriba y el desglose de cada caja, editable en el momento.
function CashBoxToday() {
  const { accounts, profile, addAccount, setAccountBalance } = useApp();
  const cash = accounts.find((a) => a.type === "cash");
  const wallet = accounts.find((a) => a.type === "wallet");
  const total = (cash ? cash.balance : 0) + (wallet ? wallet.balance : 0);
  const createBox = (type) => addAccount({ name: type === "cash" ? "Efectivo" : "Billetera Virtual", type, balance: 0, isAsset: true });

  // Arqueo rápido de caja: ajusta las dos cajas de una sola vez (por ejemplo,
  // al contar el efectivo real que tenés en el bolsillo) sin abrir ninguna
  // ventana — el formulario se expande dentro de la misma tarjeta.
  const [arqueo, setArqueo] = useState(false);
  const [cashVal, setCashVal] = useState("");
  const [walletVal, setWalletVal] = useState("");
  const startArqueo = () => { setCashVal(cash ? String(cash.balance) : "0"); setWalletVal(wallet ? String(wallet.balance) : "0"); setArqueo(true); };
  const saveArqueo = () => {
    const cv = parseFloat(cashVal); const wv = parseFloat(walletVal);
    if (cash && !isNaN(cv)) setAccountBalance(cash.id, cv);
    if (wallet && !isNaN(wv)) setAccountBalance(wallet.id, wv);
    setArqueo(false);
  };

  return (
    <Card>
      <CardContent className="p-6">
        <div className="flex items-start justify-between mb-2">
          <p className="text-xs font-medium text-slate-500 uppercase tracking-wider">Dinero en Caja Hoy</p>
          {(cash || wallet) && (
            <Btn size="sm" variant="outline" onClick={arqueo ? saveArqueo : startArqueo}>
              <Icon name={arqueo ? "check-circle-2" : "pencil"} size={14} /> {arqueo ? "Guardar Arqueo" : "Ajustar Saldos"}
            </Btn>
          )}
        </div>
        <div className="text-4xl font-semibold font-display text-gradient-abundance mb-5"><AmountText value={total} currency={profile.currency} /></div>
        {arqueo ? (
          <div className="rounded-lg border border-champagne/30 bg-champagne/5 p-4 space-y-3 animate-fade-in">
            <p className="text-[11px] text-slate-500">Arqueo rápido: corregí el saldo real de cada caja de una sola vez.</p>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {cash && <div><Label>💵 Efectivo</Label><Input autoFocus type="number" value={cashVal} onChange={(e) => setCashVal(e.target.value)} /></div>}
              {wallet && <div><Label>📱 Billetera Virtual</Label><Input type="number" value={walletVal} onChange={(e) => setWalletVal(e.target.value)} /></div>}
            </div>
            <button onClick={() => setArqueo(false)} className="text-xs text-slate-500 hover:text-champagne underline underline-offset-2">Cancelar</button>
          </div>
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <CashBoxCard acc={cash} icon="banknote" missingLabel="💵 Efectivo" missingType="cash" onCreate={createBox} />
            <CashBoxCard acc={wallet} icon="smartphone" missingLabel="📱 Billetera Virtual" missingType="wallet" onCreate={createBox} />
          </div>
        )}
      </CardContent>
    </Card>
  );
}

function ExpenseDonut() {
  const { transactions, categories, profile } = useApp();
  const data = useMemo(() => {
    const cm = monthKey(new Date().toISOString());
    const monthExp = transactions.filter((t) => t.type === "expense" && monthKey(t.date) === cm);
    const totals = new Map();
    monthExp.forEach((t) => totals.set(t.categoryId, (totals.get(t.categoryId) || 0) + t.amount));
    return Array.from(totals.entries()).map(([cid, value]) => {
      const cat = categories.find((c) => c.id === cid);
      return { name: cat ? cat.name : "Otros", value, color: cat ? cat.color : "#94A3B8" };
    }).sort((a, b) => b.value - a.value);
  }, [transactions, categories]);
  const total = data.reduce((s, d) => s + d.value, 0);
  return (
    <Card>
      <CardHeader><CardTitle>Distribución de Gastos por Categoría</CardTitle></CardHeader>
      <CardContent>

            </div>
          </div>
        )}

                <span className="h-2 w-2 rounded-full shrink-0" style={{ backgroundColor: d.color }}></span>
                <span className="text-slate-400 truncate flex-1">{d.name}</span>

  );

function MovementPanel() {
  const { movement, openMovement, closeMovement, setPage } = useNav();
  const { categories, accounts, transactions, addTransaction, addTransfer, profile, updateProfile } = useApp();
  const { toast } = useToast();
  const open = !!movement;
  const type = movement ? movement.type : "expense";

  const [categoryId, setCategoryId] = useState("");
  const [amount, setAmount] = useState("");
  const [accountId, setAccountId] = useState("");
  const [description, setDescription] = useState("");
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
  const [fromId, setFromId] = useState("");
  const [toId, setToId] = useState("");
  const [showOtherAccounts, setShowOtherAccounts] = useState(false);
  // Gasto Ocasional / Aislado: se descuenta de la caja real igual que
  // cualquier otro gasto, pero se excluye del cálculo del Límite de Gasto

  // dispare falsas alertas de cierre de mes en rojo.
  const [isOccasional, setIsOccasional] = useState(false);

  // Las dos cajas de uso diario — el resto de las cuentas (bancos, inversión,

  const dailyBoxes = useMemo(() => accounts.filter((a) => a.type === "cash" || a.type === "wallet"), [accounts]);
  const otherAccounts = useMemo(() => accounts.filter((a) => a.type !== "cash" && a.type !== "wallet"), [accounts]);

  useEffect(() => {
    if (!open) return;
    setCategoryId((movement && movement.categoryId) || ""); setAmount(""); setDescription(""); setIsOccasional(false);
    // La caja de entrada/salida NO queda fija: se recuerda la última que
    // usaste (Efectivo o Billetera) para que la elección sea fluida en vez
    // de forzar siempre la misma por defecto.
    const preferred = dailyBoxes.find((a) => a.type === profile.lastUsedBoxType) || dailyBoxes[0] || accounts[0];
    setAccountId(preferred ? preferred.id : "");
    setShowOtherAccounts(false);
    setFromId((accounts[0] || {}).id || ""); setToId((accounts[1] || {}).id || "");

  const chips = useMemo(() => type === "transfer" ? [] : mostUsedCategories(transactions, categories, type), [transactions, categories, type]);

  const submit = () => {
    const amt = parseFloat(amount);
    if (isNaN(amt) || amt <= 0) return toast({ title: "Ingresá un monto válido", variant: "error" });
    if (type === "transfer") {
      if (!fromId || !toId || fromId === toId) return toast({ title: "Elegí dos fondos distintos", variant: "error" });
      addTransfer({ date, fromAccountId: fromId, toAccountId: toId, amount: amt, description });
      const fromAcc = accounts.find((a) => a.id === fromId); const toAcc = accounts.find((a) => a.id === toId);

    } else {
      if (!categoryId) return toast({ title: "Elegí una categoría", variant: "error" });
      if (!accountId) return toast({ title: "Elegí de qué caja sale o entra la plata", variant: "error" });
      addTransaction({ date, description: description.trim() || (selectedCategory ? selectedCategory.name : ""), amount: amt, type, categoryId, account: selectedAccount ? selectedAccount.name : "", accountId, isOccasional: type === "expense" ? isOccasional : false });
      if (selectedAccount && (selectedAccount.type === "cash" || selectedAccount.type === "wallet")) updateProfile({ lastUsedBoxType: selectedAccount.type });
      toast({ title: type === "income" ? "Ingreso registrado" : "Gasto registrado", description: (selectedAccount ? selectedAccount.name + " · " : "") + formatCurrency(amt, profile.currency), variant: "success" });
    }
    closeMovement();

  const openFullForm = () => { closeMovement(); setPage("transactions"); };

      <div className="space-y-4">
        <div className="grid grid-cols-3 gap-2">
          <button onClick={() => openMovement("income")} className={cx("rounded-lg border py-2 text-xs font-semibold transition-colors", type === "income" ? "border-emerald-metallic/60 bg-emerald-metallic/15 text-emerald-metallic" : "border-slate-800 text-slate-500 hover:border-slate-700")}>+ Ingreso</button>
          <button onClick={() => openMovement("expense")} className={cx("rounded-lg border py-2 text-xs font-semibold transition-colors", type === "expense" ? "border-crimson-elegant/60 bg-crimson-elegant/15 text-crimson-elegant" : "border-slate-800 text-slate-500 hover:border-slate-700")}>- Gasto</button>

            </div>

            {chips.length > 0 && (
              <div>
                <Label>Categoría rápida</Label>
                <div className="grid grid-cols-3 gap-2">
                  {chips.map((c) => (
                    <button key={c.id} onClick={() => setCategoryId(c.id)} className={cx("flex flex-col items-center justify-center gap-1 rounded-xl border py-3 text-[11px] font-medium transition-colors", categoryId === c.id ? "border-transparent" : "border-slate-800 text-slate-400 hover:border-slate-700")} style={categoryId === c.id ? { backgroundColor: c.color + "26", color: c.color, borderColor: c.color + "80" } : {}}>

            <div>

            </div>

            <div>

              {showOtherAccounts && (

            </div>

            <div className="grid grid-cols-2 gap-3">
              <div><Label>Fecha</Label><Input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div>
              <div><Label>Descripción (opcional)</Label><Input placeholder={selectedCategory ? selectedCategory.name : "..."} value={description} onChange={(e) => setDescription(e.target.value)} /></div>
            </div>
            {type === "expense" && (

                <Switch checked={isOccasional} onChange={setIsOccasional} />

            )}
            <button onClick={openFullForm} className="text-xs text-slate-500 hover:text-champagne underline underline-offset-2">Cargar con más detalles (recurrencia, notas)</button>
          </>
        ) : (
          <>
            <div className="grid grid-cols-2 gap-3 items-end">
              <div><Label>Desde</Label><Select value={fromId} onChange={setFromId}>{accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}</Select></div>
              <div><Label>Hacia</Label><Select value={toId} onChange={setToId}>{accounts.filter((a) => a.id !== fromId).map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}</Select></div>
            </div>
            <div><Label>Monto</Label><Input type="number" step="0.01" min="0" placeholder="0.00" value={amount} onChange={(e) => setAmount(e.target.value)} className="text-2xl h-14 font-display font-semibold" /></div>

function DailySpendFilter() {
  const { transactions, categories, profile } = useApp();
  const [range, setRange] = useState("today"); // "today" | "week"
  const [categoryId, setCategoryId] = useState("all");

  const { total, byCategory } = useMemo(() => {
    const now = new Date();
    const todayStr = now.toISOString().slice(0, 10);
    const weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate() - 6);
    const weekAgoStr = weekAgo.toISOString().slice(0, 10);
    const inRange = (t) => (range === "today" ? t.date === todayStr : t.date >= weekAgoStr);
    const expenses = transactions.filter((t) => t.type === "expense" && inRange(t));
    const map = new Map();
    expenses.forEach((t) => map.set(t.categoryId, (map.get(t.categoryId) || 0) + t.amount));
    const byCategory = Array.from(map.entries()).map(([cid, value]) => {
      const cat = categories.find((c) => c.id === cid);
      return { id: cid, name: cat ? cat.name : "Otros", color: cat ? cat.color : "#94A3B8", value };
    }).sort((a, b) => b.value - a.value);
    const filtered = categoryId === "all" ? expenses : expenses.filter((t) => t.categoryId === categoryId);
    const total = filtered.reduce((s, t) => s + t.amount, 0);
    return { total, byCategory };
  }, [transactions, categories, range, categoryId]);

  const activeCatName = categoryId === "all" ? null : (byCategory.find((c) => c.id === categoryId) || {}).name;

  return (
    <Card>
      <CardHeader className="flex flex-row items-center justify-between space-y-0">
        <div className="flex items-center gap-2"><Icon name="filter" size={15} className="text-champagne" /><CardTitle className="!text-slate-300">Cuánto Gasté — Filtro Rápido</CardTitle></div>
        <Tabs tabs={[{ value: "today", label: "Hoy" }, { value: "week", label: "Esta Semana" }]} value={range} onChange={(v) => { setRange(v); setCategoryId("all"); }} />
      </CardHeader>
      <CardContent>
        <div className="text-3xl font-semibold font-display text-slate-100 tabular-nums"><AmountText value={total} currency={profile.currency} /></div>
        <p className="text-[11px] text-slate-500 mt-1 mb-4">{activeCatName ? "Gastado en " + activeCatName : "Gastado en total"} · {range === "today" ? "hoy" : "en los últimos 7 días"}</p>
        {byCategory.length === 0 ? (
          <p className="text-sm text-slate-500 py-4 text-center">Sin gastos registrados en este período.</p>
        ) : (
          <div className="flex flex-wrap gap-2">
            <button onClick={() => setCategoryId("all")} className={cx("inline-flex items-center rounded-full border px-3 py-1.5 text-xs font-medium transition-colors", categoryId === "all" ? "border-champagne/50 bg-champagne/10 text-champagne" : "border-slate-800 text-slate-400 hover:border-slate-700")}>Todas</button>
            {byCategory.map((c) => (
              <button key={c.id} onClick={() => setCategoryId(c.id)} className={cx("inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-medium transition-colors", categoryId === c.id ? "border-transparent" : "border-slate-800 text-slate-400 hover:border-slate-700")} style={categoryId === c.id ? { backgroundColor: c.color + "26", color: c.color, borderColor: c.color + "80" } : {}}>
                <span className="h-1.5 w-1.5 rounded-full" style={{ backgroundColor: c.color }}></span>{c.name} · {formatCurrency(c.value, profile.currency)}
              </button>
            ))}
          </div>
        )}
      </CardContent>
    </Card>
  );
}
// Dashboard de uso cotidiano: responde de inmediato a "¿cuánta plata me

// Módulo de Ingresos Mixtos: separa el Sueldo Fijo Mensual (con fecha

function IncomeSourcesCard() {
  const { transactions, profile, updateProfile } = useApp();
  const { openMovement } = useNav();
  const [editingSalary, setEditingSalary] = useState(false);
  const [salaryAmt, setSalaryAmt] = useState("");
  const [salaryDay, setSalaryDay] = useState("");

  const cm = monthKey(new Date().toISOString());
  const monthIncomeTx = useMemo(() => transactions.filter((t) => t.type === "income" && monthKey(t.date) === cm), [transactions, cm]);
  const fixedReceived = monthIncomeTx.filter((t) => t.categoryId === "cat-salary").reduce((s, t) => s + t.amount, 0);
  const variableReceived = monthIncomeTx.filter((t) => t.categoryId === "cat-freelance").reduce((s, t) => s + t.amount, 0);
  const otherReceived = monthIncomeTx.filter((t) => t.categoryId !== "cat-salary" && t.categoryId !== "cat-freelance").reduce((s, t) => s + t.amount, 0);
  const totalReceived = fixedReceived + variableReceived + otherReceived;
  const salaryAlreadyLogged = fixedReceived > 0;

  const startEditSalary = () => { setSalaryAmt(String(profile.fixedSalaryAmount || 0)); setSalaryDay(String(profile.fixedSalaryDay || 1)); setEditingSalary(true); };

    updateProfile({ fixedSalaryAmount: parseFloat(salaryAmt) || 0, fixedSalaryDay: Math.min(Math.max(parseInt(salaryDay, 10) || 1, 1), 28) });

    <Card>

        <div className="rounded-lg border border-slate-800/70 bg-slate-900/40 p-4">

            {!editingSalary && <button onClick={startEditSalary} title="Editar" className="text-slate-500 hover:text-champagne"><Icon name="pencil" size={13} /></button>}
          </div>
          {editingSalary ? (
            <div className="grid grid-cols-2 gap-2 mt-2">
              <div><Label>Monto</Label><Input autoFocus type="number" value={salaryAmt} onChange={(e) => setSalaryAmt(e.target.value)} /></div>
              <div><Label>Día de cobro</Label><Input type="number" min="1" max="28" value={salaryDay} onChange={(e) => setSalaryDay(e.target.value)} /></div>
              <div className="col-span-2 flex justify-end gap-2"><Btn size="sm" variant="ghost" onClick={() => setEditingSalary(false)}>Cancelar</Btn><Btn size="sm" onClick={saveSalary}>Guardar</Btn></div>

          ) : (
            <>
              <p className="text-lg font-semibold font-display tabular-nums text-slate-100"><AmountText value={profile.fixedSalaryAmount || 0} currency={profile.currency} /></p>
              <div className="flex items-center justify-between mt-1">
                <p className="text-[11px] text-slate-500">Cobro estimado: día {profile.fixedSalaryDay || 1} de cada mes</p>

              </div>

          )}

        <div className="rounded-lg border border-slate-800/70 bg-slate-900/40 p-4">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2 text-sm text-slate-100"><Icon name="laptop" size={15} className="text-cobalt" /> Planificaciones Online</div>

          </div>

          <p className="text-[11px] text-slate-500 mt-0.5">Suma de cada cobro de cliente cargado este mes</p>
        </div>
      </CardContent>
    </Card>
  );

// Estrategia de Cierre de Mes: gasto promedio mensual + una recomendación

// Control de Vencimientos y Cuotas: registra compras en 3/6/12 cuotas,

function InstallmentsAndDueCard() {
  const { accounts, transactions, installments, categories, addInstallment, deleteInstallment, profile } = useApp();
  const due = useMemo(() => computeUpcomingDue(transactions, installments, 15), [transactions, installments]);
  const cash = accounts.find((a) => a.type === "cash");
  const wallet = accounts.find((a) => a.type === "wallet");
  const liquid = (cash ? cash.balance : 0) + (wallet ? wallet.balance : 0);

  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ description: "", totalAmount: "", installmentsCount: "3", startDate: new Date().toISOString().slice(0, 10), categoryId: "" });

/* ============================================================================
   REGISTRO EXPRESS (categorías más usadas para el panel de Acciones Rápidas)
   ============================================================================ */
function mostUsedCategories(transactions, categories, type, limit = 8) {
  const counts = new Map();
  transactions.filter((t) => t.type === type).forEach((t) => counts.set(t.categoryId, (counts.get(t.categoryId) || 0) + 1));
  const typeCategories = categories.filter((c) => c.type === type);
  const sorted = [...typeCategories].sort((a, b) => (counts.get(b.id) || 0) - (counts.get(a.id) || 0));
  return sorted.slice(0, limit);
}

function nextOccurrence(dateISO, frequency) {
  const d = new Date(dateISO);
  if (frequency === "weekly") d.setDate(d.getDate() + 7);
  else if (frequency === "biweekly") d.setDate(d.getDate() + 14);
  else if (frequency === "monthly") d.setMonth(d.getMonth() + 1);
  else if (frequency === "yearly") d.setFullYear(d.getFullYear() + 1);
  return d.toISOString().slice(0, 10);
}

function RecurringPanel() {
  const { transactions, categories, addTransaction, updateTransaction, profile } = useApp();
  const { toast } = useToast();
  const recurring = transactions.filter((t) => t.isRecurring && t.recurrence && t.recurrence.active);
  if (recurring.length === 0) return null;
  const processNow = (id) => {
    const tx = transactions.find((t) => t.id === id);
    if (!tx || !tx.recurrence) return;
    addTransaction({ date: tx.recurrence.nextDate, description: tx.description, amount: tx.amount, type: tx.type, categoryId: tx.categoryId, account: tx.account, notes: tx.notes });
    updateTransaction(id, { recurrence: { ...tx.recurrence, nextDate: nextOccurrence(tx.recurrence.nextDate, tx.recurrence.frequency) } });
    toast({ title: "Movimiento recurrente procesado", description: tx.description, variant: "success" });
  };
  return (
    <Card>
      <CardHeader><CardTitle>Transacciones Recurrentes</CardTitle><CardDescription>Suscripciones y pagos fijos programados</CardDescription></CardHeader>
      <CardContent className="space-y-2">
        {recurring.map((t) => {
          const cat = categories.find((c) => c.id === t.categoryId);
          const isDue = t.recurrence && new Date(t.recurrence.nextDate) <= new Date();
          return (
            <div key={t.id} className="flex items-center justify-between rounded-lg border border-slate-800/60 bg-slate-900/40 px-4 py-3">
              <div className="flex items-center gap-3 min-w-0">
                <div className="flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-champagne/10 text-champagne"><Icon name="repeat" size={15} /></div>
                <div className="min-w-0"><p className="text-sm text-slate-100 truncate">{t.description}</p><p className="text-[11px] text-slate-500">{cat ? cat.name : ""} · {FREQ_LABEL[t.recurrence.frequency]} · Próximo: {formatDate(t.recurrence.nextDate)}</p></div>
              </div>
              <div className="flex items-center gap-3 shrink-0">
                <span className={cx("text-sm font-medium tabular-nums", t.type === "income" ? "text-emerald-metallic" : "text-crimson-elegant")}>{formatCurrency(t.amount, profile.currency)}</span>
                {isDue && <Btn variant="outline" size="sm" onClick={() => processNow(t.id)}><Icon name="play" size={14} /> Procesar</Btn>}
              </div>
            </div>
          );
        })}
      </CardContent>
    </Card>
  );
}

const GROUP_META = {
  needs: { label: "Necesidades", description: "Vivienda, servicios, alimentación, salud, transporte", color: "#F43F5E", target: RULE_502030.needs },
  wants: { label: "Deseos", description: "Gastronomía, entretenimiento, compras, viajes", color: "#D4AF7A", target: RULE_502030.wants },
  savings: { label: "Ahorro / Inversión", description: "Ahorro, inversión y aportes a metas", color: "#3B82F6", target: RULE_502030.savings },
};
function Rule502030Card() {
  const { transactions, categories, profile } = useApp();
  const { groupTotals, income } = useMemo(() => {
    const cm = monthKey(new Date().toISOString());
    const monthExp = transactions.filter((t) => t.type === "expense" && monthKey(t.date) === cm);
    const monthInc = transactions.filter((t) => t.type === "income" && monthKey(t.date) === cm).reduce((s, t) => s + t.amount, 0);
    const totals = { needs: 0, wants: 0, savings: 0 };
    monthExp.forEach((t) => { const cat = categories.find((c) => c.id === t.categoryId); if (cat) totals[cat.budgetGroup] += t.amount; });
    return { groupTotals: totals, income: monthInc };
  }, [transactions, categories]);
  const totalSpent = groupTotals.needs + groupTotals.wants + groupTotals.savings;
  return (
    <Card>
      <CardHeader><CardTitle>Regla 50/30/20</CardTitle><CardDescription>50% Necesidades · 30% Deseos · 20% Ahorro e Inversión</CardDescription></CardHeader>
      <CardContent className="space-y-5">
        {Object.keys(GROUP_META).map((group) => {
          const meta = GROUP_META[group]; const spent = groupTotals[group];
          const actualPercent = income > 0 ? (spent / income) * 100 : totalSpent > 0 ? (spent / totalSpent) * 100 : 0;
          const over = actualPercent > meta.target;
          return (
            <div key={group}>
              <div className="flex items-center justify-between mb-1.5">
                <div><p className="text-sm font-medium text-slate-100">{meta.label}</p><p className="text-[11px] text-slate-500">{meta.description}</p></div>
                <div className="text-right"><p className={cx("text-sm font-semibold tabular-nums", over ? "text-crimson-elegant" : "text-slate-100")}>{formatPercent(actualPercent)}<span className="text-slate-500 font-normal"> / {meta.target}%</span></p><p className="text-[11px] text-slate-500 tabular-nums">{formatCurrency(spent, profile.currency)}</p></div>
              </div>
              <Progress value={Math.min(actualPercent, 100)} colorClass="" style={{ backgroundColor: over ? "#F43F5E" : "#D4AF7A" }} />
            </div>
          );
        })}
        {income === 0 && <p className="text-[11px] text-slate-500 pt-1">Registrá ingresos del mes para calcular los porcentajes sobre tu ingreso real.</p>}
      </CardContent>
    </Card>
  );
}
function BudgetLimits() {
  const { transactions, categories, budgets, upsertBudget, deleteBudget, profile } = useApp();
  const [open, setOpen] = useState(false); const [categoryId, setCategoryId] = useState(""); const [limit, setLimit] = useState("");

                <div className="flex items-center gap-3">
                  <span className={cx("text-xs font-medium tabular-nums", status.color)}>{formatCurrency(spent, profile.currency)} / {formatCurrency(budget.monthlyLimit, profile.currency)}</span>
                  <button onClick={() => deleteBudget(budget.id)} className="opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="trash-2" size={14} className="text-slate-500 hover:text-crimson-elegant" /></button>
                </div>

              <p className={cx("text-[11px] mt-1 tabular-nums", status.color)}>{formatPercent(percent)} utilizado · {status.label}</p>
            </div>
          );
        })}
      </CardContent>
      <Panel open={open} onClose={() => setOpen(false)} title="Nuevo Límite de Presupuesto" footer={<><Btn variant="ghost" onClick={() => setOpen(false)}>Cancelar</Btn><Btn onClick={save}><Icon name="settings-2" size={15} /> Guardar Límite</Btn></>}>
        <div className="space-y-4">
          <div><Label>Categoría</Label><Select value={categoryId} onChange={setCategoryId}><option value="">Elegir categoría</option>{expenseCats.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}</Select></div>
          <div><Label>Límite Mensual</Label><Input type="number" min="0" step="0.01" placeholder="0.00" value={limit} onChange={(e) => setLimit(e.target.value)} /></div>
        </div>
      </Panel>
    </Card>
  );
}

const DIAGNOSTIC_TONE = {
  alerta: { color: "#F43F5E", bg: "bg-crimson-elegant/10", border: "border-crimson-elegant/30", badge: "crimson", label: "Alerta" },
  compra: { color: "#D4AF7A", bg: "bg-champagne/10", border: "border-champagne/30", badge: "champagne", label: "Estrategia de Compras" },
  ahorro: { color: "#3B82F6", bg: "bg-cobalt/10", border: "border-cobalt/30", badge: "cobalt", label: "Optimización de Ahorro" },
  inversion: { color: "#10B981", bg: "bg-emerald-metallic/10", border: "border-emerald-metallic/30", badge: "emerald", label: "Inversión de Excedentes" },
  info: { color: "#10B981", bg: "bg-emerald-metallic/10", border: "border-emerald-metallic/30", badge: "emerald", label: "Estado General" },
};
function buildAIPrompt(data, profile) {
  const { diagnostics, kpis, runway, comparison, monthIncome, monthExpensesTotal } = data;
  const lines = [];
  lines.push("Actuá como un asesor financiero personal, cercano y concreto. Analizá esta situación financiera (los datos están anonimizados, sin nombres ni descripciones personales) y dame recomendaciones accionables en español.");
  lines.push("");
  lines.push("DATOS FINANCIEROS:");
  lines.push("- Dinero total disponible: " + formatCurrency(kpis.netWorth, profile.currency));
  lines.push("- Disponible este mes (ingresos - gastos): " + formatCurrency(kpis.monthlyCashFlow, profile.currency));
  lines.push("- Tasa de ahorro del mes: " + kpis.savingsRate.toFixed(1) + "%");
  lines.push("- Meses de colchón / respaldo con fondos líquidos: " + runway.months.toFixed(1) + " (meta recomendada: " + runway.targetMonths + ")");
  lines.push("- Ingresos de este mes: " + formatCurrency(monthIncome, profile.currency));
  lines.push("- Gastos de este mes: " + formatCurrency(monthExpensesTotal, profile.currency));
  if (comparison.avgPrevTotal > 0) {
    lines.push("- Comparado con el promedio de los últimos " + comparison.monthsCompared + " meses (" + formatCurrency(comparison.avgPrevTotal, profile.currency) + "), este mes el gasto varió " + (comparison.totalDeltaPercent >= 0 ? "+" : "") + comparison.totalDeltaPercent.toFixed(1) + "%.");
  }
  if (comparison.rows.length > 0) {
    lines.push("- Categorías de gasto de este mes (de mayor a menor variación vs promedio):");
    comparison.rows.slice(0, 8).forEach((r) => {
      lines.push("   · " + r.name + ": " + formatCurrency(r.current, profile.currency) + " (" + (r.deltaPercent >= 0 ? "+" : "") + r.deltaPercent.toFixed(0) + "% vs promedio)");
    });
  }
  lines.push("");
  lines.push("DIAGNÓSTICOS AUTOMÁTICOS DEL SISTEMA:");
  diagnostics.forEach((d) => lines.push("- [" + DIAGNOSTIC_TONE[d.type].label + "] " + d.title + ": " + d.detail));
  lines.push("");
  lines.push("Con esta información dame, en formato breve:");
  lines.push("1. Una evaluación general de mi salud financiera (1-2 líneas).");
  lines.push("2. Tres acciones concretas para optimizar mi ahorro este mes.");
  lines.push("3. Una recomendación puntual sobre qué hacer con el excedente disponible este mes.");
  return lines.join("\n");
}

          <Btn variant="destructive" onClick={() => setConfirming(true)}><Icon name="trash-2" size={16} /> Vaciar Datos de Prueba y Empezar de Cero</Btn>
        ) : (
          <div className="rounded-lg border border-crimson-elegant/40 bg-crimson-elegant/10 p-4 space-y-3 animate-fade-in">
            <p className="text-sm text-slate-100">¿Seguro? Se van a borrar todas las transacciones, metas, deudas y compras en cuotas guardadas, y tus cajas de Efectivo y Billetera Virtual vuelven a $0. Esta acción no se puede deshacer.</p>
            <div className="flex gap-2">
              <Btn variant="ghost" size="sm" onClick={() => setConfirming(false)}>Cancelar</Btn>
              <Btn variant="destructive" size="sm" onClick={doReset}><Icon name="trash-2" size={14} /> Sí, borrar todo</Btn>
            </div>
          </div>
        )}
      </CardContent>
    </Card>
  );
}
function SettingsPage() {
  return (
    <div className="space-y-6 animate-fade-in max-w-3xl">
      <div><h2 className="text-xl font-semibold font-display text-slate-100">Ajustes</h2><p className="text-sm text-slate-500">Personalizá tu experiencia y gestioná tus datos.</p></div>
      <DataResetCard />
      <ProfileCard />
      <CloudSyncCard />
      <AccountsCard />
      <Card>
        <CardHeader><CardTitle>Respaldo de Datos</CardTitle><CardDescription>Exportá o importá toda tu información financiera</CardDescription></CardHeader>
        <CardContent><ImportExportMenu /></CardContent>
      </Card>
    </div>
  );
}

/* ============================================================================
   APP ROOT
   ============================================================================ */
// Botón Flotante (+) de carga rápida — visible en mobile en cualquier parte
// del scroll. Abre el mismo panel único (MovementPanel, ahora global en el
// Shell) y sube al inicio de la página para que se vea al instante.
function FAB() {
  const { openMovement } = useNav();
  const handleClick = () => {
    openMovement("expense");
    if (typeof window !== "undefined") window.scrollTo({ top: 0, behavior: "smooth" });
  };
  return (
    <button onClick={handleClick} title="Carga rápida" aria-label="Carga rápida"
      className="md:hidden fixed right-4 z-40 flex h-14 w-14 items-center justify-center rounded-full bg-champagne text-onyx-950 shadow-glow-champagne active:scale-95 transition-transform"
      style={{ bottom: "calc(4rem + env(safe-area-inset-bottom) + 12px)" }}>
      <Icon name="plus" size={26} />
    </button>
  );
}
function Shell({ children }) {
  const { movement } = useNav();
  return (
    <div className="flex min-h-screen bg-onyx-950">
      <Sidebar />
      <div className="flex-1 flex flex-col min-w-0">
        <Header />
        <main className="flex-1 px-4 md:px-8 py-6 pb-24 md:pb-8 max-w-[1600px] w-full mx-auto space-y-6">
          {/* Panel único global — así la Carga Exprès y el FAB funcionan
              desde cualquier página, sin duplicar el panel ni abrir una
              segunda capa flotante. */}
          <MovementPanel />
          {children}
        </main>
      </div>
      <MobileBar />
      {!movement && <FAB />}
    </div>
  );
}
function AppShellRouter() {
  const { page } = useNav();
  return (
    <Shell>
      {page === "dashboard" && <DashboardPage />}
      {page === "transactions" && <TransactionsPage />}
      {page === "budgets" && <BudgetsPage />}
      {page === "analytics" && <AnalyticsPage />}
      {page === "copilot" && <AICopilotPage />}
      {page === "settings" && <SettingsPage />}
    </Shell>
  );
}
function App() {
  return (
    <NavProvider>
      <AppDataProvider>
        <ToastProvider>
          <AppShellRouter />
        </ToastProvider>
      </AppDataProvider>
    </NavProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<!-- PWA: registro del Service Worker para instalación y uso offline.
     Nota técnica: los navegadores NO permiten registrar un Service Worker
     desde una URL blob: o data: (protocolo no soportado por la spec), así
     que se registra el archivo real "sw.js" que se entrega junto a este
     index.html. Si el archivo no está presente (por ejemplo, en una vista
     previa local) la app sigue funcionando normalmente, solo sin caché
     offline ni instalación nativa en Android. -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").then(function (reg) {
        console.log("Service Worker registrado:", reg.scope);
      }).catch(function (err) {
        console.warn("No se pudo registrar el Service Worker (¿falta sw.js junto a index.html?):", err.message);
      });
    });
  }
</script>
</body>
