function uid() {

}
function formatCurrency(value, currency = "USD", locale = "es-AR") {

}
function formatCompact(value, currency = "USD", locale = "es-AR") {

function monthKey(dateISO) { return (dateISO || "").slice(0, 7); }
function lastNMonths(n) {
  const months = [];
  const now = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"));
  }
  return months;
}
function computeMonthlyTotals(transactions, months) {
  return months.map((m) => {
    const income = transactions.filter((t) => t.type === "income" && monthKey(t.date) === m).reduce((s, t) => s + t.amount, 0);
    const expense = transactions.filter((t) => t.type === "expense" && monthKey(t.date) === m).reduce((s, t) => s + t.amount, 0);
    return { month: m, income, expense, net: income - expense };
  });
}
function computeKPIs(transactions, accounts) {
  const totalAssets = accounts.filter((a) => a.isAsset).reduce((s, a) => s + a.balance, 0);
  const totalLiabilities = accounts.filter((a) => !a.isAsset).reduce((s, a) => s + Math.abs(a.balance), 0);
  const netWorth = totalAssets - totalLiabilities;
  const currentMonth = monthKey(new Date().toISOString());
  const monthTx = transactions.filter((t) => monthKey(t.date) === currentMonth);
  const monthIncome = monthTx.filter((t) => t.type === "income").reduce((s, t) => s + t.amount, 0);
  const monthExpense = monthTx.filter((t) => t.type === "expense").reduce((s, t) => s + t.amount, 0);
  const monthlyCashFlow = monthIncome - monthExpense;
  const savingsRate = monthIncome > 0 ? (monthlyCashFlow / monthIncome) * 100 : 0;
  const last3 = computeMonthlyTotals(transactions, lastNMonths(3));
  const avgMonthlyExpense = (last3.reduce((s, m) => s + m.expense, 0) / 3) || monthExpense || 1;
  const liquidAssets = accounts.filter((a) => a.isAsset && ["checking", "savings", "cash", "wallet"].includes(a.type)).reduce((s, a) => s + a.balance, 0);
  const freedomRunwayMonths = avgMonthlyExpense > 0 ? liquidAssets / avgMonthlyExpense : 0;
  return { netWorth, monthlyCashFlow, savingsRate, freedomRunwayMonths, totalAssets, totalLiabilities };
}
function computeEmergencyRunway(transactions, accounts) {
  const last3 = computeMonthlyTotals(transactions, lastNMonths(3));
  const monthExpenseNow = computeMonthlyTotals(transactions, [monthKey(new Date().toISOString())])[0].expense;
  const avgMonthlyExpense = (last3.reduce((s, m) => s + m.expense, 0) / 3) || monthExpenseNow || 1;
  const liquidAssets = accounts.filter((a) => a.isAsset && ["checking", "savings", "cash", "wallet"].includes(a.type)).reduce((s, a) => s + a.balance, 0);
  const months = avgMonthlyExpense > 0 ? liquidAssets / avgMonthlyExpense : 0;
  const targetMonths = 6;
  const percentToTarget = Math.min((months / targetMonths) * 100, 100);
  let status = "Crítico", statusColor = "#F43F5E";
  if (months >= 12) { status = "Excelente"; statusColor = "#10B981"; }
  else if (months >= 6) { status = "Sólido"; statusColor = "#10B981"; }
  else if (months >= 3) { status = "Ajustado"; statusColor = "#D4AF7A"; }
  return { liquidAssets, avgMonthlyExpense, months, targetMonths, percentToTarget, status, statusColor };
}
function computeProjectedCashFlow(transactions) {
  const now = new Date();
  const cm = monthKey(now.toISOString());
  const totalDays = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const elapsedDays = now.getDate();
  const monthTx = transactions.filter((t) => monthKey(t.date) === cm);
  const income = monthTx.filter((t) => t.type === "income").reduce((s, t) => s + t.amount, 0);
  const expense = monthTx.filter((t) => t.type === "expense").reduce((s, t) => s + t.amount, 0);
  const pace = totalDays / Math.max(elapsedDays, 1);
  const projectedIncome = income * pace;
  const projectedExpense = expense * pace;
  return {
    income, expense, currentCashFlow: income - expense,
    projectedIncome, projectedExpense, projectedCashFlow: projectedIncome - projectedExpense,
    daysRemaining: Math.max(totalDays - elapsedDays, 0), totalDays, elapsedDays,
  };
}
function computeCompoundInterest({ initial, monthlyContribution, annualRatePercent, years }) {
  const monthlyRate = annualRatePercent / 100 / 12;
  const points = [{ year: 0, contributions: 0, interest: 0, total: initial }];
  let balance = initial, totalContrib = 0;
  for (let year = 1; year <= years; year++) {
    for (let m = 0; m < 12; m++) { balance = balance * (1 + monthlyRate) + monthlyContribution; totalContrib += monthlyContribution; }
    points.push({ year, contributions: totalContrib, interest: Math.max(balance - initial - totalContrib, 0), total: balance });
  }
  return points;
}
function simulateDebtPayoff(debts, extraMonthlyPayment, strategy) {
  const working = debts.map((d) => ({ ...d, remaining: d.balance }));
  const sorted = [...working].sort((a, b) => strategy === "avalanche" ? b.interestRate - a.interestRate : a.balance - b.balance);
  const months = []; const payoffOrder = [];
  let month = 0, totalPaid = 0, totalInterest = 0;
  const maxMonths = 600;
  while (sorted.some((d) => d.remaining > 0.01) && month < maxMonths) {
    month++;
    let extra = extraMonthlyPayment;
    for (const debt of sorted) {
      if (debt.remaining <= 0) continue;
      const monthlyInterest = (debt.interestRate / 100 / 12) * debt.remaining;
      totalInterest += monthlyInterest; debt.remaining += monthlyInterest;
      const payment = Math.min(debt.minimumPayment, debt.remaining);
      debt.remaining -= payment; totalPaid += payment;
    }
    for (const debt of sorted) {
      if (extra <= 0) break;
      if (debt.remaining <= 0) continue;
      const payment = Math.min(extra, debt.remaining);
      debt.remaining -= payment; totalPaid += payment; extra -= payment;
    }
    for (const debt of sorted) {
      if (debt.remaining <= 0.01 && !payoffOrder.find((p) => p.id === debt.id)) payoffOrder.push({ id: debt.id, name: debt.name, monthPaidOff: month });
    }
    months.push({ month, totalRemaining: sorted.reduce((s, d) => s + Math.max(d.remaining, 0), 0), totalPaid, totalInterest });
  }
  return { months, payoffOrder };
}

  useEffect(() => saveLocal(KEYS.transactions, transactions), [transactions]);
  useEffect(() => saveLocal(KEYS.categories, categories), [categories]);
  useEffect(() => saveLocal(KEYS.budgets, budgets), [budgets]);
  useEffect(() => saveLocal(KEYS.goals, goals), [goals]);
  useEffect(() => saveLocal(KEYS.debts, debts), [debts]);
  useEffect(() => saveLocal(KEYS.accounts, accounts), [accounts]);
  useEffect(() => saveLocal(KEYS.profile, profile), [profile]);
  useEffect(() => saveLocal(KEYS.supabaseConfig, supabaseConfig), [supabaseConfig]);

  // Inicializa el cliente de Supabase si hay credenciales guardadas
  useEffect(() => {
    if (!supabaseConfig.url || !supabaseConfig.anonKey || !window.supabase) { setCloudClient(null); return; }
    try {
      const client = window.supabase.createClient(supabaseConfig.url, supabaseConfig.anonKey);
      setCloudClient(client);
      client.auth.getSession().then(({ data }) => setCloudUser(data.session ? data.session.user : null));
      const { data: listener } = client.auth.onAuthStateChange((_e, session) => setCloudUser(session ? session.user : null));
      return () => listener.subscription.unsubscribe();
    } catch (e) { setCloudClient(null); }
  }, [supabaseConfig.url, supabaseConfig.anonKey]);

  // Hidratación desde la nube al iniciar sesión
  useEffect(() => {
    if (!cloudClient || !cloudUser || hydrated.current) return;
    hydrated.current = true;
    setSyncing(true);
    (async () => {
      try {
        const [txRes, budRes, goalRes] = await Promise.all([
          cloudClient.from("transactions").select("*").eq("user_id", cloudUser.id),
          cloudClient.from("budgets").select("*").eq("user_id", cloudUser.id),
          cloudClient.from("goals").select("*").eq("user_id", cloudUser.id),
        ]);
        if (txRes.data && txRes.data.length) {
          setTransactions(txRes.data.map((r) => ({ id: r.id, date: r.date, description: r.description, amount: Number(r.amount), type: r.type, categoryId: r.category_id, account: r.account || "", notes: r.notes || undefined, isRecurring: r.is_recurring || false, recurrence: r.recurrence || undefined, createdAt: r.created_at, updatedAt: r.updated_at })));
        }
        if (budRes.data && budRes.data.length) {
          setBudgets(budRes.data.map((r) => ({ id: r.id, categoryId: r.category_id, monthlyLimit: Number(r.monthly_limit), month: r.month })));
        }
        if (goalRes.data && goalRes.data.length) {
          setGoals(goalRes.data.map((r) => ({ id: r.id, name: r.name, type: r.type, targetAmount: Number(r.target_amount), currentAmount: Number(r.current_amount), targetDate: r.target_date || undefined, color: r.color, createdAt: r.created_at })));
        }
      } catch (e) { console.warn("Sync error", e); }
      setSyncing(false);
    })();
  }, [cloudClient, cloudUser]);

  const pushCloud = useCallback((table, row) => {
    if (!cloudClient || !cloudUser) return;
    cloudClient.from(table).upsert({ ...row, user_id: cloudUser.id }).then(({ error }) => { if (error) console.warn(error); });
  }, [cloudClient, cloudUser]);
  const removeCloud = useCallback((table, id) => {
    if (!cloudClient || !cloudUser) return;
    cloudClient.from(table).delete().eq("id", id).eq("user_id", cloudUser.id).then(() => {});
  }, [cloudClient, cloudUser]);

  const addTransaction = useCallback((t) => {
    const now = new Date().toISOString();
    const newTx = { ...t, id: uid(), createdAt: now, updatedAt: now };
    setTransactions((prev) => [newTx, ...prev]);
    if (newTx.type !== "transfer") {
      pushCloud("transactions", { id: newTx.id, date: newTx.date, description: newTx.description, amount: newTx.amount, type: newTx.type, category_id: newTx.categoryId, account: newTx.account, notes: newTx.notes || null, is_recurring: newTx.isRecurring || false, recurrence: newTx.recurrence || null, created_at: newTx.createdAt, updated_at: newTx.updatedAt });
    }
    return newTx;
  }, [pushCloud]);
  // Las transferencias entre cuentas se registran localmente (mueven saldo entre
  // dos cuentas) y no se sincronizan a Supabase, ya que el esquema de la tabla
  // `transactions` solo admite type in ('income','expense').
  const addTransfer = useCallback((t) => {
    const now = new Date().toISOString();
    const newTx = { id: uid(), type: "transfer", date: t.date, description: (t.description && t.description.trim()) || "Transferencia interna", amount: t.amount, fromAccountId: t.fromAccountId, toAccountId: t.toAccountId, createdAt: now, updatedAt: now };
    setTransactions((prev) => [newTx, ...prev]);
    setAccounts((prev) => prev.map((a) => {
      if (a.id === t.fromAccountId) return { ...a, balance: a.balance - t.amount };
      if (a.id === t.toAccountId) return { ...a, balance: a.balance + t.amount };
      return a;
    }));
    return newTx;
  }, []);
  const duplicateTransaction = useCallback((id) => {
    const tx = transactions.find((t) => t.id === id);
    if (!tx) return null;
    if (tx.type === "transfer") {
      return addTransfer({ date: new Date().toISOString().slice(0, 10), fromAccountId: tx.fromAccountId, toAccountId: tx.toAccountId, amount: tx.amount, description: tx.description });
    }
    return addTransaction({ date: new Date().toISOString().slice(0, 10), description: tx.description, amount: tx.amount, type: tx.type, categoryId: tx.categoryId, account: tx.account, notes: tx.notes, isRecurring: false, recurrence: undefined });
    // eslint-disable-next-line
  }, [transactions]);
  const updateTransaction = useCallback((id, t) => {
    const updatedAt = new Date().toISOString();
    setTransactions((prev) => prev.map((tx) => tx.id === id ? { ...tx, ...t, updatedAt } : tx));
    pushCloud("transactions", { id, ...(t.date !== undefined && { date: t.date }), ...(t.description !== undefined && { description: t.description }), ...(t.amount !== undefined && { amount: t.amount }), ...(t.type !== undefined && { type: t.type }), ...(t.categoryId !== undefined && { category_id: t.categoryId }), ...(t.account !== undefined && { account: t.account }), ...(t.notes !== undefined && { notes: t.notes }), ...(t.recurrence !== undefined && { recurrence: t.recurrence }), updated_at: updatedAt });
  }, [pushCloud]);
  const deleteTransaction = useCallback((id) => {
    setTransactions((prev) => {
      const tx = prev.find((t) => t.id === id);
      if (tx && tx.type === "transfer") {
        // Revierte el movimiento de saldo entre cuentas antes de borrar el registro
        setAccounts((accPrev) => accPrev.map((a) => {
          if (a.id === tx.fromAccountId) return { ...a, balance: a.balance + tx.amount };
          if (a.id === tx.toAccountId) return { ...a, balance: a.balance - tx.amount };
          return a;
        }));
      }
      return prev.filter((t) => t.id !== id);
    });
    removeCloud("transactions", id);
  }, [removeCloud]);
  const bulkAddTransactions = useCallback((items) => {
    const now = new Date().toISOString();
    const newItems = items.map((t) => ({ ...t, id: uid(), createdAt: now, updatedAt: now }));
    setTransactions((prev) => [...newItems, ...prev]);
    newItems.forEach((newTx) => pushCloud("transactions", { id: newTx.id, date: newTx.date, description: newTx.description, amount: newTx.amount, type: newTx.type, category_id: newTx.categoryId, account: newTx.account, notes: newTx.notes || null, created_at: newTx.createdAt, updated_at: newTx.updatedAt }));
    return newItems;
  }, [pushCloud]);

  const upsertBudget = useCallback((b) => {
    setBudgets((prev) => {
      const id = b.id || uid();
      const newBudget = { ...b, id };
      pushCloud("budgets", { id: newBudget.id, category_id: newBudget.categoryId, monthly_limit: newBudget.monthlyLimit, month: newBudget.month });
      const idx = prev.findIndex((x) => x.id === id);
      if (idx >= 0) { const copy = [...prev]; copy[idx] = newBudget; return copy; }
      return [...prev, newBudget];
    });
  }, [pushCloud]);
  const deleteBudget = useCallback((id) => { setBudgets((prev) => prev.filter((b) => b.id !== id)); removeCloud("budgets", id); }, [removeCloud]);

  const addGoal = useCallback((g) => {
    const newGoal = { ...g, id: uid(), createdAt: new Date().toISOString() };
    setGoals((prev) => [...prev, newGoal]);
    pushCloud("goals", { id: newGoal.id, name: newGoal.name, type: newGoal.type, target_amount: newGoal.targetAmount, current_amount: newGoal.currentAmount, target_date: newGoal.targetDate || null, color: newGoal.color, created_at: newGoal.createdAt });
  }, [pushCloud]);
  const updateGoal = useCallback((id, g) => {
    setGoals((prev) => prev.map((goal) => goal.id === id ? { ...goal, ...g } : goal));
    pushCloud("goals", { id, ...(g.name !== undefined && { name: g.name }), ...(g.currentAmount !== undefined && { current_amount: g.currentAmount }), ...(g.targetAmount !== undefined && { target_amount: g.targetAmount }) });
  }, [pushCloud]);
  const deleteGoal = useCallback((id) => { setGoals((prev) => prev.filter((g) => g.id !== id)); removeCloud("goals", id); }, [removeCloud]);

  const addDebt = useCallback((d) => setDebts((prev) => [...prev, { ...d, id: uid(), createdAt: new Date().toISOString() }]), []);
  const deleteDebt = useCallback((id) => setDebts((prev) => prev.filter((d) => d.id !== id)), []);

  const addAccount = useCallback((a) => setAccounts((prev) => [...prev, { ...a, id: uid() }]), []);
  const deleteAccount = useCallback((id) => setAccounts((prev) => prev.filter((a) => a.id !== id)), []);

  // Vacía transacciones, cuentas, metas, deudas y presupuestos de prueba para
  // que la persona pueda empezar con su información real. Mantiene el perfil,
  // las categorías y la configuración de sincronización.
  const resetAllData = useCallback(() => {
    setTransactions([]);
    setGoals([]);
    setDebts([]);
    setAccounts([]);
    setBudgets([]);
  }, []);

  const updateProfile = useCallback((p) => setProfile((prev) => ({ ...prev, ...p })), []);
  const toggleHideBalances = useCallback(() => setProfile((prev) => ({ ...prev, hideBalances: !prev.hideBalances })), []);

  const exportJSON = useCallback(() => JSON.stringify({ transactions, categories, budgets, goals, debts, accounts, profile, exportedAt: new Date().toISOString() }, null, 2), [transactions, categories, budgets, goals, debts, accounts, profile]);
  const importJSON = useCallback((json) => {
    try {
      const p = JSON.parse(json);
      if (p.transactions) setTransactions(p.transactions);
      if (p.categories) setCategories(p.categories);
      if (p.budgets) setBudgets(p.budgets);
      if (p.goals) setGoals(p.goals);
      if (p.debts) setDebts(p.debts);
      if (p.accounts) setAccounts(p.accounts);
      if (p.profile) setProfile((prev) => ({ ...prev, ...p.profile }));
      return { success: true };
    } catch (e) { return { success: false, error: "El archivo JSON no es válido." }; }
  }, []);
  const exportCSV = useCallback(() => {
    const header = ["date", "description", "amount", "type", "categoryId", "account", "notes"];
    const rows = transactions.map((t) => [t.date, '"' + (t.description || "").replace(/"/g, '""') + '"', t.amount, t.type, t.categoryId, t.account, t.notes || ""].join(","));
    return [header.join(","), ...rows].join("\n");
  }, [transactions]);
  const importCSV = useCallback((csv) => {
    try {
      const lines = csv.trim().split("\n");
      const [headerLine, ...rows] = lines;
      const headers = headerLine.split(",").map((h) => h.trim());
      const now = new Date().toISOString();
      const parsed = rows.filter((r) => r.trim()).map((row) => {
        const cols = row.match(/(".*?"|[^,]+)(?=,|$)/g) || [];
        const obj = {};
        headers.forEach((h, i) => { obj[h] = (cols[i] || "").replace(/^"|"$/g, "").replace(/""/g, '"'); });
        return { id: uid(), date: obj.date, description: obj.description, amount: parseFloat(obj.amount) || 0, type: obj.type === "income" ? "income" : "expense", categoryId: obj.categoryId || "cat-other", account: obj.account || "Cuenta Corriente", notes: obj.notes || undefined, createdAt: now, updatedAt: now };
      });
      setTransactions((prev) => [...parsed, ...prev]);
      return { success: true, imported: parsed.length };
    } catch (e) { return { success: false, imported: 0, error: "No se pudo procesar el archivo CSV." }; }
  }, []);

  const signInWithEmail = useCallback(async (email) => {
    if (!cloudClient) return { error: "Configurá primero tu URL y clave de Supabase." };
    const { error } = await cloudClient.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
    return { error: error ? error.message : null };
  }, [cloudClient]);
  const signOut = useCallback(async () => { if (cloudClient) await cloudClient.auth.signOut(); }, [cloudClient]);

  const value = {
    transactions, categories, budgets, goals, debts, accounts, profile,
    supabaseConfig, setSupabaseConfig, cloudUser, syncing, cloudEnabled: !!cloudClient,
    addTransaction, updateTransaction, deleteTransaction, bulkAddTransactions, addTransfer, duplicateTransaction,
    upsertBudget, deleteBudget, addGoal, updateGoal, deleteGoal, addDebt, deleteDebt,
    addAccount, deleteAccount, resetAllData, updateProfile, toggleHideBalances,
    exportJSON, importJSON, exportCSV, importCSV, signInWithEmail, signOut,
  };
  return <AppDataContext.Provider value={value}>{children}</AppDataContext.Provider>;
}
function useApp() { return useContext(AppDataContext); }

function useChart(canvasRef, config, deps) {
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current.getContext("2d"), config);
    return () => { if (chartRef.current) chartRef.current.destroy(); };
    // eslint-disable-next-line
  }, deps);
}

    type: "doughnut",
    data: { labels: data.map((d) => d.name), datasets: [{ data: data.map((d) => d.value), backgroundColor: data.map((d) => d.color), borderWidth: 0, spacing: 2 }] },
    options: {
      cutout: "68%", responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { backgroundColor: "rgba(9,13,22,0.95)", borderColor: "rgba(148,163,184,0.2)", borderWidth: 1, padding: 10, callbacks: { label: (ctx) => formatCurrency(ctx.parsed, currency) } } },
    },
  }, [JSON.stringify(data), currency]);
  return <canvas ref={canvasRef} height="240"></canvas>;
}

function AreaChartCmp({ labels, series, color, currency, xSuffix = "" }) {
  const canvasRef = useRef(null);
  useChart(canvasRef, {
    type: "line",
    data: { labels, datasets: [{ data: series, borderColor: color, borderWidth: 2, pointRadius: 0, tension: 0.35, fill: true,
      backgroundColor: (ctx) => { const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 220); g.addColorStop(0, color + "66"); g.addColorStop(1, color + "00"); return g; } }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { grid: { display: false }, ticks: { color: "#64748b", font: { size: 11 }, callback: (v, i) => labels[i] + xSuffix } },
        y: { grid: { color: "rgba(148,163,184,0.08)" }, ticks: { color: "#64748b", font: { size: 11 }, callback: (v) => formatCompact(v, currency) } },
      },
      plugins: { legend: { display: false }, tooltip: { backgroundColor: "rgba(9,13,22,0.95)", borderColor: "rgba(148,163,184,0.2)", borderWidth: 1, padding: 10, callbacks: { label: (ctx) => formatCurrency(ctx.parsed.y, currency) } } },

function ExpenseDonut() {
  const { transactions, categories, profile } = useApp();
  const data = useMemo(() => {
    const cm = monthKey(new Date().toISOString());
    const monthExp = transactions.filter((t) => t.type === "expense" && monthKey(t.date) === cm);
    const totals = new Map();
    monthExp.forEach((t) => totals.set(t.categoryId, (totals.get(t.categoryId) || 0) + t.amount));
    return Array.from(totals.entries()).map(([cid, value]) => {
      const cat = categories.find((c) => c.id === cid);

/* ============================================================================
   REGISTRO EXPRESS (categorías más usadas para el panel de Acciones Rápidas)
   ============================================================================ */
function mostUsedCategories(transactions, categories, type, limit = 8) {
  const counts = new Map();
  transactions.filter((t) => t.type === type).forEach((t) => counts.set(t.categoryId, (counts.get(t.categoryId) || 0) + 1));
  const typeCategories = categories.filter((c) => c.type === type);
  const sorted = [...typeCategories].sort((a, b) => (counts.get(b.id) || 0) - (counts.get(a.id) || 0));
  return sorted.slice(0, limit);
}

function nextOccurrence(dateISO, frequency) {
  const d = new Date(dateISO);
  if (frequency === "weekly") d.setDate(d.getDate() + 7);
  else if (frequency === "biweekly") d.setDate(d.getDate() + 14);
  else if (frequency === "monthly") d.setMonth(d.getMonth() + 1);
  else if (frequency === "yearly") d.setFullYear(d.getFullYear() + 1);
  return d.toISOString().slice(0, 10);
}

const GROUP_META = {
  needs: { label: "Necesidades", description: "Vivienda, servicios, alimentación, salud, transporte", color: "#F43F5E", target: RULE_502030.needs },
  wants: { label: "Deseos", description: "Gastronomía, entretenimiento, compras, viajes", color: "#D4AF7A", target: RULE_502030.wants },
  savings: { label: "Ahorro / Inversión", description: "Ahorro, inversión y aportes a metas", color: "#3B82F6", target: RULE_502030.savings },
};
function Rule502030Card() {
  const { transactions, categories, profile } = useApp();
  const { groupTotals, income } = useMemo(() => {
    const cm = monthKey(new Date().toISOString());
    const monthExp = transactions.filter((t) => t.type === "expense" && monthKey(t.date) === cm);
    const monthInc = transactions.filter((t) => t.type === "income" && monthKey(t.date) === cm).reduce((s, t) => s + t.amount, 0);
    const totals = { needs: 0, wants: 0, savings: 0 };
    monthExp.forEach((t) => { const cat = categories.find((c) => c.id === t.categoryId); if (cat) totals[cat.budgetGroup] += t.amount; });
    return { groupTotals: totals, income: monthInc };
  }, [transactions, categories]);
  const totalSpent = groupTotals.needs + groupTotals.wants + groupTotals.savings;
  return (
    <Card>
      <CardHeader><CardTitle>Regla 50/30/20</CardTitle><CardDescription>50% Necesidades · 30% Deseos · 20% Ahorro e Inversión</CardDescription></CardHeader>
      <CardContent className="space-y-5">
        {Object.keys(GROUP_META).map((group) => {
          const meta = GROUP_META[group]; const spent = groupTotals[group];
          const actualPercent = income > 0 ? (spent / income) * 100 : totalSpent > 0 ? (spent / totalSpent) * 100 : 0;
          const over = actualPercent > meta.target;
          return (
            <div key={group}>
              <div className="flex items-center justify-between mb-1.5">
                <div><p className="text-sm font-medium text-slate-100">{meta.label}</p><p className="text-[11px] text-slate-500">{meta.description}</p></div>
                <div className="text-right"><p className={cx("text-sm font-semibold tabular-nums", over ? "text-crimson-elegant" : "text-slate-100")}>{formatPercent(actualPercent)}<span className="text-slate-500 font-normal"> / {meta.target}%</span></p><p className="text-[11px] text-slate-500 tabular-nums">{formatCurrency(spent, profile.currency)}</p></div>
              </div>
              <Progress value={Math.min(actualPercent, 100)} colorClass="" style={{ backgroundColor: over ? "#F43F5E" : "#D4AF7A" }} />
            </div>
          );
        })}
        {income === 0 && <p className="text-[11px] text-slate-500 pt-1">Registrá ingresos del mes para calcular los porcentajes sobre tu ingreso real.</p>}
      </CardContent>
    </Card>
  );
}
function BudgetLimits() {
  const { transactions, categories, budgets, upsertBudget, deleteBudget, profile } = useApp();
  const [open, setOpen] = useState(false); const [categoryId, setCategoryId] = useState(""); const [limit, setLimit] = useState("");
  const cm = monthKey(new Date().toISOString());
  const expenseCats = categories.filter((c) => c.type === "expense");
  const monthBudgets = budgets.filter((b) => b.month === cm);
  const rows = useMemo(() => monthBudgets.map((b) => {
    const cat = categories.find((c) => c.id === b.categoryId);

    const percent = b.monthlyLimit > 0 ? (spent / b.monthlyLimit) * 100 : 0;
    return { budget: b, category: cat, spent, percent };
  }).sort((a, b) => b.percent - a.percent), [monthBudgets, categories, transactions]);
  const save = () => { if (!categoryId || !limit) return; upsertBudget({ categoryId, monthlyLimit: parseFloat(limit), month: cm }); setOpen(false); setCategoryId(""); setLimit(""); };
  const statusFor = (p) => p >= 100 ? { color: "text-crimson-elegant", bar: "#F43F5E", icon: "alert-triangle", label: "Excedido" } : p >= 80 ? { color: "text-champagne", bar: "#D4AF7A", icon: "alert-triangle", label: "Atención" } : { color: "text-emerald-metallic", bar: "#10B981", icon: "check-circle-2", label: "En control" };
  return (
    <Card>
      <CardHeader className="flex flex-row items-center justify-between space-y-0">
        <div><CardTitle>Límites de Presupuesto</CardTitle><CardDescription>Indicadores semafóricos por categoría — mes actual</CardDescription></div>

      <CardContent className="space-y-4">
        {rows.length === 0 ? <p className="text-sm text-slate-500 py-6 text-center">No configuraste límites de presupuesto todavía.</p> : rows.map(({ budget, category, spent, percent }) => {
          const status = statusFor(percent);
          return (
            <div key={budget.id} className="group">
              <div className="flex items-center justify-between mb-1.5">
                <div className="flex items-center gap-2"><Icon name={status.icon} size={14} className={status.color} /><span className="text-sm text-slate-100">{category ? category.name : "Categoría"}</span></div>
                <div className="flex items-center gap-3">
                  <span className={cx("text-xs font-medium tabular-nums", status.color)}>{formatCurrency(spent, profile.currency)} / {formatCurrency(budget.monthlyLimit, profile.currency)}</span>
                  <button onClick={() => deleteBudget(budget.id)} className="opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="trash-2" size={14} className="text-slate-500 hover:text-crimson-elegant" /></button>
                </div>
              </div>
              <Progress value={Math.min(percent, 100)} colorClass="" style={{ backgroundColor: status.bar }} />
              <p className={cx("text-[11px] mt-1 tabular-nums", status.color)}>{formatPercent(percent)} utilizado · {status.label}</p>
            </div>
          );
        })}
      </CardContent>
      <Modal open={open} onClose={() => setOpen(false)} title="Nuevo Límite de Presupuesto" footer={<><Btn variant="ghost" onClick={() => setOpen(false)}>Cancelar</Btn><Btn onClick={save}><Icon name="settings-2" size={15} /> Guardar Límite</Btn></>}>
        <div className="space-y-4">
          <div><Label>Categoría</Label><Select value={categoryId} onChange={setCategoryId}><option value="">Elegir categoría</option>{expenseCats.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}</Select></div>
          <div><Label>Límite Mensual</Label><Input type="number" min="0" step="0.01" placeholder="0.00" value={limit} onChange={(e) => setLimit(e.target.value)} /></div>
        </div>
      </Modal>
    </Card>
  );
}

function GoalsTracker() {
  const { goals, addGoal, updateGoal, deleteGoal, profile } = useApp();
  const [open, setOpen] = useState(false); const [contributeId, setContributeId] = useState(null); const [contributeAmount, setContributeAmount] = useState("");
  const [form, setForm] = useState({ name: "", type: "savings", targetAmount: "", currentAmount: "", targetDate: "" });
  const addNew = () => { if (!form.name || !form.targetAmount) return; addGoal({ name: form.name, type: form.type, targetAmount: parseFloat(form.targetAmount), currentAmount: parseFloat(form.currentAmount) || 0, targetDate: form.targetDate || undefined, color: GOAL_COLORS[goals.length % GOAL_COLORS.length] }); setForm({ name: "", type: "savings", targetAmount: "", currentAmount: "", targetDate: "" }); setOpen(false); };
  const contribute = () => { if (!contributeId) return; const g = goals.find((x) => x.id === contributeId); if (!g) return; updateGoal(contributeId, { currentAmount: g.currentAmount + (parseFloat(contributeAmount) || 0) }); setContributeId(null); setContributeAmount(""); };
  return (
    <Card>
      <CardHeader className="flex flex-row items-center justify-between space-y-0">
        <div><CardTitle>Metas de Ahorro e Inversión</CardTitle><CardDescription>Seguimiento de avance hacia tus objetivos</CardDescription></div>
        <Btn size="sm" variant="outline" onClick={() => setOpen(true)}><Icon name="plus" size={14} /> Nueva Meta</Btn>
      </CardHeader>
      <CardContent>
        {goals.length === 0 ? <p className="text-sm text-slate-500 py-6 text-center">Aún no definiste metas. Creá la primera.</p> : (
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {goals.map((g) => {
              const percent = g.targetAmount > 0 ? (g.currentAmount / g.targetAmount) * 100 : 0;
              return (
                <div key={g.id} className="rounded-lg border border-slate-800/70 bg-slate-900/40 p-4">
                  <div className="flex items-start justify-between mb-3">
                    <div className="flex items-center gap-2.5">
                      <div className="flex h-9 w-9 items-center justify-center rounded-lg" style={{ backgroundColor: g.color + "1A", color: g.color }}><Icon name="target" size={16} /></div>
                      <div><p className="text-sm font-medium text-slate-100">{g.name}</p><p className="text-[11px] text-slate-500">{GOAL_TYPE_LABEL[g.type]}</p></div>
                    </div>
                    <button onClick={() => deleteGoal(g.id)}><Icon name="trash-2" size={14} className="text-slate-500 hover:text-crimson-elegant" /></button>
                  </div>
                  <Progress value={Math.min(percent, 100)} colorClass="" style={{ backgroundColor: g.color }} />
                  <div className="flex items-center justify-between mt-2">
                    <span className="text-xs text-slate-400 tabular-nums">{formatCurrency(g.currentAmount, profile.currency)} / {formatCurrency(g.targetAmount, profile.currency)}</span>
                    <span className="text-xs font-medium tabular-nums" style={{ color: g.color }}>{formatPercent(percent, 0)}</span>
                  </div>
                  <Btn size="sm" variant="secondary" className="w-full mt-3" onClick={() => setContributeId(g.id)}><Icon name="trending-up" size={14} /> Aportar</Btn>
                </div>
              );
            })}
          </div>
        )}
      </CardContent>
      <Modal open={open} onClose={() => setOpen(false)} title="Nueva Meta" footer={<><Btn variant="ghost" onClick={() => setOpen(false)}>Cancelar</Btn><Btn onClick={addNew}>Crear Meta</Btn></>}>
        <div className="space-y-4">
          <div><Label>Nombre</Label><Input placeholder="Ej: Fondo de Emergencia" value={form.name} onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))} /></div>
          <div><Label>Tipo</Label><Select value={form.type} onChange={(v) => setForm((f) => ({ ...f, type: v }))}>{Object.entries(GOAL_TYPE_LABEL).map(([v, l]) => <option key={v} value={v}>{l}</option>)}</Select></div>
          <div className="grid grid-cols-2 gap-3">
            <div><Label>Monto Objetivo</Label><Input type="number" min="0" value={form.targetAmount} onChange={(e) => setForm((f) => ({ ...f, targetAmount: e.target.value }))} /></div>
            <div><Label>Monto Actual</Label><Input type="number" min="0" value={form.currentAmount} onChange={(e) => setForm((f) => ({ ...f, currentAmount: e.target.value }))} /></div>
          </div>
          <div><Label>Fecha Objetivo (opcional)</Label><Input type="date" value={form.targetDate} onChange={(e) => setForm((f) => ({ ...f, targetDate: e.target.value }))} /></div>
        </div>
      </Modal>
      <Modal open={!!contributeId} onClose={() => setContributeId(null)} title="Aportar a la Meta" footer={<><Btn variant="ghost" onClick={() => setContributeId(null)}>Cancelar</Btn><Btn onClick={contribute}>Confirmar Aporte</Btn></>}>
        <div><Label>Monto a Aportar</Label><Input type="number" min="0" value={contributeAmount} onChange={(e) => setContributeAmount(e.target.value)} /></div>
      </Modal>
    </Card>
  );
}
function AnalyticsPage() {
  const [tab, setTab] = useState("wealth");
  return (
    <div className="space-y-6 animate-fade-in">
      <div><h2 className="text-xl font-semibold font-display text-slate-100">Analítica Proyectiva &amp; Patrimonio</h2><p className="text-sm text-slate-500">Proyectá tu riqueza futura y diseñá tu estrategia de libertad financiera.</p></div>
      <Tabs tabs={[{ value: "wealth", label: "Interés Compuesto" }, { value: "debt", label: "Deudas" }, { value: "goals", label: "Metas" }]} value={tab} onChange={setTab} />
      <div className="mt-4">{tab === "wealth" && <CompoundInterestCalculator />}{tab === "debt" && <DebtManager />}{tab === "goals" && <GoalsTracker />}</div>
    </div>
  );
}

/* ============================================================================
   SETTINGS PAGE
   ============================================================================ */
const SQL_SCHEMA = "-- Ver schema.sql completo entregado junto al proyecto Next.js.\\n-- Resumen de tablas: profiles, categories, transactions, budgets, goals.\\n-- Incluye Row Level Security por usuario y triggers de updated_at.";
function ProfileCard() {
  const { profile, updateProfile } = useApp();
  const CURRENCIES = ["USD", "EUR", "ARS", "GBP", "CHF"];
  return (
    <Card>
      <CardHeader><CardTitle>Perfil</CardTitle><CardDescription>Preferencias personales y de privacidad</CardDescription></CardHeader>
      <CardContent className="space-y-4">
        <div><Label>Nombre</Label><Input value={profile.fullName} onChange={(e) => updateProfile({ fullName: e.target.value })} /></div>
        <div><Label>Moneda</Label><Select value={profile.currency} onChange={(v) => updateProfile({ currency: v })}>{CURRENCIES.map((c) => <option key={c} value={c}>{c}</option>)}</Select></div>
        <div className="flex items-center justify-between rounded-lg border border-slate-800 px-4 py-3">
          <div><p className="text-sm font-medium text-slate-100">Ocultar Saldos por Defecto</p><p className="text-[11px] text-slate-500">Modo privacidad al abrir la app</p></div>
          <Switch checked={profile.hideBalances} onChange={(v) => updateProfile({ hideBalances: v })} />
        </div>
      </CardContent>
    </Card>
  );
}
function CloudSyncCard() {
  const { supabaseConfig, setSupabaseConfig, cloudEnabled, cloudUser, signInWithEmail, signOut } = useApp();
  const { toast } = useToast();
  const [urlField, setUrlField] = useState(supabaseConfig.url); const [keyField, setKeyField] = useState(supabaseConfig.anonKey);
  const [email, setEmail] = useState(""); const [sending, setSending] = useState(false);
  const saveConfig = () => { setSupabaseConfig({ url: urlField.trim(), anonKey: keyField.trim() }); toast({ title: "Configuración de Supabase guardada", variant: "success" }); };
  const doSignIn = async () => {
    if (!email.trim()) return;
    setSending(true);
    const { error } = await signInWithEmail(email.trim());
    setSending(false);
    toast(error ? { title: "No se pudo enviar el enlace", description: error, variant: "error" } : { title: "Revisá tu email", description: "Te enviamos un enlace mágico para iniciar sesión.", variant: "success" });
  };
  return (
    <Card>
      <CardHeader><CardTitle>Sincronización en la Nube</CardTitle><CardDescription>Multi-dispositivo con Supabase — con fallback automático a LocalStorage</CardDescription></CardHeader>
      <CardContent className="space-y-4">
        {!cloudEnabled ? (
          <div className="space-y-3">
            <p className="text-sm text-slate-400">Pegá la URL y la clave anónima (anon key) de tu proyecto de Supabase (Project Settings → API) para activar la sincronización cloud. Ejecutá antes el <code className="text-champagne">schema.sql</code> provisto. Sin esto, la app funciona 100% offline con LocalStorage.</p>
            <div><Label>Project URL</Label><Input placeholder="https://tu-proyecto.supabase.co" value={urlField} onChange={(e) => setUrlField(e.target.value)} /></div>
            <div><Label>Anon Public Key</Label><Input placeholder="eyJhbGciOi..." value={keyField} onChange={(e) => setKeyField(e.target.value)} /></div>
            <Btn onClick={saveConfig}><Icon name="database" size={15} /> Guardar Configuración</Btn>
          </div>
        ) : cloudUser ? (
          <div className="flex items-center justify-between rounded-lg border border-emerald-metallic/30 bg-emerald-metallic/10 p-4">
            <div className="flex items-center gap-3"><Icon name="cloud" size={16} className="text-emerald-metallic" /><div><p className="text-sm text-slate-100">{cloudUser.email}</p><Badge variant="emerald" className="mt-1">Sincronizado</Badge></div></div>
            <Btn variant="ghost" size="sm" onClick={signOut}><Icon name="log-out" size={14} /> Salir</Btn>
          </div>
        ) : (
          <div className="space-y-3">
            <p className="text-sm text-slate-400">Iniciá sesión con tu email para sincronizar tus datos entre PC, tablet y móvil.</p>
            <div className="flex gap-2"><Input type="email" placeholder="tu@email.com" value={email} onChange={(e) => setEmail(e.target.value)} /><Btn onClick={doSignIn} disabled={sending}><Icon name="mail" size={15} /> {sending ? "Enviando..." : "Enviar Enlace"}</Btn></div>
            <Btn variant="ghost" size="sm" onClick={() => setSupabaseConfig({ url: "", anonKey: "" })}>Cambiar credenciales</Btn>
          </div>
        )}
      </CardContent>
    </Card>
  );
}
function AccountsCard() {
  const { accounts, addAccount, deleteAccount, profile } = useApp();
  const [open, setOpen] = useState(false); const [form, setForm] = useState({ name: "", type: "cash", balance: "", isAsset: true });
  const addNew = () => { if (!form.name) return; addAccount({ name: form.name, type: form.type, balance: parseFloat(form.balance) || 0, isAsset: form.isAsset }); setForm({ name: "", type: "cash", balance: "", isAsset: true }); setOpen(false); };
  return (
    <Card>
      <CardHeader className="flex flex-row items-center justify-between space-y-0">
        <div><CardTitle>Tus Fondos y Cuentas</CardTitle><CardDescription>Efectivo, billeteras virtuales, bancos, inversiones y tarjetas</CardDescription></div>
        <Btn size="sm" variant="outline" onClick={() => setOpen((o) => !o)}><Icon name="plus" size={14} /> Agregar Cuenta</Btn>
      </CardHeader>
      <CardContent className="space-y-2">
        {accounts.length === 0 && <p className="text-sm text-slate-500 py-4 text-center">Todavía no tenés cuentas cargadas. Agregá la primera.</p>}
        {accounts.map((acc) => (
          <div key={acc.id} className="flex items-center justify-between rounded-lg border border-slate-800/60 bg-slate-900/40 px-4 py-3">
            <div><p className="text-sm text-slate-100">{acc.name}</p><p className="text-[11px] text-slate-500">{ACCOUNT_TYPE_LABEL[acc.type]} · {acc.isAsset ? "Plata a favor" : "Deuda"}</p></div>
            <div className="flex items-center gap-3"><span className="text-sm font-medium tabular-nums text-slate-100">{formatCurrency(acc.balance, profile.currency)}</span><button onClick={() => deleteAccount(acc.id)}><Icon name="trash-2" size={14} className="text-slate-500 hover:text-crimson-elegant" /></button></div>
          </div>
        ))}
        <Panel open={open} onClose={() => setOpen(false)} title="Nueva Cuenta">
          <div className="space-y-4">
            <div><Label>Nombre</Label><Input placeholder="Ej: Mercado Pago, Efectivo, Banco Galicia..." value={form.name} onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))} /></div>
            <div><Label>Tipo de Fondo</Label><Select value={form.type} onChange={(v) => setForm((f) => ({ ...f, type: v }))}>{Object.entries(ACCOUNT_TYPE_LABEL).map(([v, l]) => <option key={v} value={v}>{l}</option>)}</Select></div>
            <div><Label>Saldo</Label><Input type="number" value={form.balance} onChange={(e) => setForm((f) => ({ ...f, balance: e.target.value }))} /></div>
            <div className="flex items-center justify-between rounded-lg border border-slate-800 px-4 py-3"><p className="text-sm text-slate-100">Es plata a favor (no una deuda)</p><Switch checked={form.isAsset} onChange={(v) => setForm((f) => ({ ...f, isAsset: v }))} /></div>
            <div className="flex flex-col-reverse sm:flex-row sm:justify-end sm:space-x-2 pt-2 gap-2 sm:gap-0">
              <Btn variant="ghost" onClick={() => setOpen(false)}>Cancelar</Btn>
              <Btn onClick={addNew}>Agregar</Btn>
            </div>
          </div>
        </Panel>
      </CardContent>
    </Card>
  );
}
function DataResetCard() {
  const { resetAllData } = useApp();
  const { toast } = useToast();
  const [confirming, setConfirming] = useState(false);
  const doReset = () => {
    resetAllData();
    toast({ title: "Listo, empezaste de cero", description: "Se borraron los datos de prueba.", variant: "success" });
    setConfirming(false);
  };
  return (
    <Card className="border-crimson-elegant/30">
      <CardHeader><CardTitle className="!text-crimson-elegant">Empezar de Cero</CardTitle><CardDescription>Borrá los datos de ejemplo y cargá tu información real</CardDescription></CardHeader>
      <CardContent>
        {!confirming ? (
          <Btn variant="destructive" onClick={() => setConfirming(true)}><Icon name="trash-2" size={16} /> Vaciar Datos de Prueba y Empezar de Cero</Btn>
        ) : (
          <div className="rounded-lg border border-crimson-elegant/40 bg-crimson-elegant/10 p-4 space-y-3 animate-fade-in">
            <p className="text-sm text-slate-100">¿Seguro? Se van a borrar todas las transacciones, cuentas, metas y deudas guardadas. Esta acción no se puede deshacer.</p>
            <div className="flex gap-2">
              <Btn variant="ghost" size="sm" onClick={() => setConfirming(false)}>Cancelar</Btn>
              <Btn variant="destructive" size="sm" onClick={doReset}><Icon name="trash-2" size={14} /> Sí, borrar todo</Btn>
            </div>
          </div>
        )}
      </CardContent>
    </Card>
  );
}
function SettingsPage() {
  return (
    <div className="space-y-6 animate-fade-in max-w-3xl">
      <div><h2 className="text-xl font-semibold font-display text-slate-100">Ajustes</h2><p className="text-sm text-slate-500">Personalizá tu experiencia y gestioná tus datos.</p></div>

      <Card>

        <CardContent><ImportExportMenu /></CardContent>
      </Card>
    </div>
  );
}
